# Minimal Mosquitto broker config for a Pi-based WiFi test rig
# Run: mosquitto -c mosquitto.conf

listener 1883
protocol mqtt

# WebSocket listener too, handy if you want a browser dashboard later
listener 9001
protocol websockets

# Start simple - open access on your isolated lab network.
# For anything beyond a lab bench, add authentication:
#   password_file /etc/mosquitto/passwd
#   allow_anonymous false
allow_anonymous true

persistence true
persistence_location /var/lib/mosquitto/

log_dest stdout
log_type all
