<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pi Fleet Controller</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #111; color: #eee; display: flex; flex-direction: column; }
  header { flex: 0 0 auto; display: flex; gap: 0.5rem; align-items: center; padding: 0.75rem 1rem; background: #1a1a1a; border-bottom: 1px solid #333; }
  header h1 { font-size: 1rem; margin: 0; margin-right: 1rem; }
  nav { display: flex; gap: 0.25rem; margin-right: 1rem; }
  nav button.tab { background: transparent; border: 1px solid transparent; }
  nav button.tab.active { background: #2a2a2a; border-color: #444; }
  input, select { padding: 0.4rem 0.6rem; background: #222; border: 1px solid #444; color: #eee; border-radius: 4px; }
  input[type="checkbox"] { width: 1rem; height: 1rem; accent-color: #4a7; color-scheme: dark; }
  button { padding: 0.4rem 0.9rem; border: 1px solid #444; background: #2a2a2a; color: #eee; border-radius: 4px; cursor: pointer; }
  button:hover { background: #333; }
  button:disabled { opacity: 0.5; cursor: default; }
  /* Each view fills whatever vertical space is left below the header,
     regardless of the header's actual rendered height - avoids the page
     needing to scroll just to reveal the active tab's content. */
  .view { display: none; flex: 1 1 auto; min-height: 0; }
  #fleet.active { display: grid; }
  #captures.active { display: flex; flex-direction: column; }

  .line { padding: 0.25rem 0; border-bottom: 1px solid #222; font-family: ui-monospace, monospace; font-size: 0.85rem; white-space: pre-wrap; word-break: break-word; }
  .ts { color: #888; margin-right: 0.6rem; }
  .lvl { display: inline-block; min-width: 3.5rem; text-transform: uppercase; font-weight: bold; margin-right: 0.6rem; }
  .lvl-info { color: #6cf; }
  .lvl-warning { color: #fc6; }
  .lvl-error { color: #f66; }
  .lvl-unknown { color: #999; }
  .msg { color: #ddd; }

  #fleet { grid-template-columns: 1fr 6px 380px; gap: 1rem; padding: 1rem; }
  #captures { padding: 1rem; }
  .captures-panel { flex: 1 1 auto; min-height: 0; }
  #fleet.dragging { user-select: none; cursor: col-resize; }
  .panel { background: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 0.75rem; overflow-y: auto; overflow-x: auto; min-width: 0; }
  .gutter { width: 6px; margin: 0 -0.5rem; border-radius: 3px; background: #2a2a2a; cursor: col-resize; }
  .gutter:hover, .gutter.active { background: #444; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid #262626; }
  th { color: #999; font-weight: 600; }
  tr.pi-row { cursor: pointer; }
  tr.pi-row:hover { background: #222; }
  tr.pi-row.selected { background: #263a2a; }
  .pi-toggle { display: inline-block; padding: 0.05rem 0.3rem; margin-right: 0.2rem; font-size: 0.7rem; color: #999; cursor: pointer; border: 1px solid #333; border-radius: 3px; }
  .pi-toggle:hover { background: #222; color: #eee; }
  tr.pi-toolbar-row td { background: #181818; padding: 0.4rem 0.5rem; }
  tr.pi-toolbar-row.hidden { display: none; }
  tr.pi-log-row td { background: #141414; padding: 0; }
  tr.pi-log-row.hidden { display: none; }
  .pi-log-heading { display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; color: #888; padding: 0.4rem 0.75rem 0.2rem; }
  .pi-log-actions { display: flex; gap: 0.4rem; text-transform: none; letter-spacing: normal; }
  .pi-log-actions button.icon-btn { border: 1px solid #333; }
  .pi-log-actions button.recording { background: #522; border-color: #a44; color: #fbb; }
  .pi-log-panel { max-height: 240px; overflow-y: auto; padding: 0.2rem 0.75rem 0.5rem; }
  .pi-log-panel .line { border-bottom: 1px solid #202020; }
  .pi-log-empty { color: #666; font-size: 0.78rem; padding: 0.4rem 0; }
  .badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 10px; font-size: 0.75rem; }
  .badge-online { background: #163; }
  .badge-offline { background: #522; }
  .badge-unassigned { background: #333; color: #999; }
  label { display: block; font-size: 0.8rem; color: #aaa; margin: 0.6rem 0 0.2rem; }
  .field { width: 100%; }
  .row { display: flex; gap: 0.5rem; }
  .row > * { flex: 1; }
  #cmdResults { margin-top: 1rem; }
  .cmd-entry { border: 1px solid #262626; border-radius: 4px; padding: 0.5rem; margin-bottom: 0.5rem; font-size: 0.8rem; }
  .cmd-entry .hdr { display: flex; justify-content: space-between; color: #aaa; margin-bottom: 0.3rem; }
  .cmd-status { text-transform: uppercase; font-weight: bold; }
  .cmd-status.pending { color: #fc6; }
  .cmd-status.complete { color: #6f6; }
  .cmd-status.failed, .cmd-status.timeout { color: #f66; }
  .cmd-entry .hdr { cursor: pointer; user-select: none; }
  .cmd-entry .toggle { color: #777; margin-right: 0.4rem; display: inline-block; width: 0.7rem; }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 2.1rem; height: 2.1rem; padding: 0; border: none; background: transparent; color: #888; font-size: 1.3rem; line-height: 1; border-radius: 4px; text-decoration: none; cursor: pointer; }
  .icon-btn:hover { color: #eee; background: #2a2a2a; }
  .cmd-delete { margin-left: 0.5rem; }
  .cmd-delete:hover { color: #f66; background: #2a2a2a; }
  .capture-actions { display: flex; gap: 0.2rem; white-space: nowrap; }
  .capture-actions .capture-delete:hover { color: #f66; }
  .cmd-entry.collapsed .result { display: none; }
  .result { margin-top: 0.4rem; }
  table.result-table { width: 100%; border-collapse: collapse; font-family: ui-monospace, monospace; font-size: 0.78rem; }
  table.result-table td { padding: 0.15rem 0.4rem; border-bottom: 1px solid #222; vertical-align: top; white-space: pre-wrap; word-break: break-word; }
  table.result-table .result-key { color: #888; width: 40%; }
  table.result-table .result-value { color: #ddd; }
  table.result-table table.result-table { margin: 0; }
  table.result-array-table th { padding: 0.15rem 0.4rem; border-bottom: 1px solid #444; color: #888; text-align: left; white-space: nowrap; }
  table.result-array-table td { white-space: nowrap; }
  td.result-nested-label { padding-top: 0.5rem; font-weight: 600; }
  td.result-nested { padding: 0 0 0.4rem 0.75rem; }
  .hint { color: #777; font-size: 0.75rem; margin-top: 0.5rem; }
</style>
</head>
<body>
<header>
  <h1>Pi Fleet Controller</h1>
  <nav>
    <button class="tab active" data-view="fleet">Fleet</button>
    <button class="tab" data-view="captures">Captures</button>
  </nav>
</header>

<section id="fleet" class="view active">
  <div class="panel">
    <table>
      <thead>
        <tr><th></th><th></th><th>Pi ID</th><th>IP</th><th>Role</th><th>Status</th><th>Last seen</th><th>Primary IF</th></tr>
      </thead>
      <tbody id="piTableBody"></tbody>
    </table>
  </div>

  <div class="gutter" id="fleetGutter"></div>

  <div class="panel">
    <label>Target</label>
    <select id="targetSelect" class="field">
      <option value="all">all (broadcast)</option>
    </select>
    <div id="targetHint" class="hint" style="display: none;"></div>

    <label>Action</label>
    <select id="actionSelect" class="field">
      <option value="ping">ping</option>
      <option value="signal_stats">signal_stats</option>
      <option value="band_channel_info">band_channel_info</option>
      <option value="throughput_test">throughput_test</option>
      <option value="set_channel">set_channel</option>
      <option value="syslog">syslog</option>
      <option value="stream_logs">stream_logs</option>
      <option value="stop_logs">stop_logs</option>
      <option value="tcpdump">tcpdump</option>
      <option value="stop_tcpdump">stop_tcpdump</option>
      <option value="connect_wifi">connect_wifi</option>
      <option value="disconnect_wifi">disconnect_wifi</option>
      <option value="list_interfaces">list_interfaces</option>
      <option value="list_interface_ips">list_interface_ips</option>
    </select>

    <div id="paramFields"></div>

    <div class="row" style="margin-top: 0.75rem;">
      <button id="sendCmdBtn">Send command</button>
    </div>

    <div id="cmdResults"></div>
  </div>
</section>

<section id="captures" class="view">
  <div class="panel captures-panel">
    <table>
      <thead>
        <tr><th>Pi</th><th>Category</th><th>Name</th><th>Lines</th><th>Created</th><th></th></tr>
      </thead>
      <tbody id="capturesTableBody"></tbody>
    </table>
  </div>
</section>

<script>
const API = '';
const tabs = document.querySelectorAll('nav .tab');
const views = document.querySelectorAll('.view');
tabs.forEach(btn => btn.addEventListener('click', () => {
  tabs.forEach(b => b.classList.remove('active'));
  views.forEach(v => v.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(btn.dataset.view).classList.add('active');
}));

// --- Fleet: resizable split between the Pi table and the command panel ----

(function setupFleetGutter() {
  const fleet = document.getElementById('fleet');
  const gutter = document.getElementById('fleetGutter');
  const MIN_RIGHT = 260;
  const MAX_RIGHT = 800;

  function applyRightWidth(px) {
    fleet.style.gridTemplateColumns = `1fr 6px ${px}px`;
  }

  const saved = parseInt(localStorage.getItem('fleetRightWidth'), 10);
  if (saved && saved >= MIN_RIGHT && saved <= MAX_RIGHT) applyRightWidth(saved);

  gutter.addEventListener('mousedown', (e) => {
    e.preventDefault();
    fleet.classList.add('dragging');
    gutter.classList.add('active');

    function onMove(moveEvent) {
      const fleetRect = fleet.getBoundingClientRect();
      let rightWidth = fleetRect.right - moveEvent.clientX;
      rightWidth = Math.max(MIN_RIGHT, Math.min(MAX_RIGHT, rightWidth));
      applyRightWidth(rightWidth);
    }

    function onUp() {
      fleet.classList.remove('dragging');
      gutter.classList.remove('active');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      const currentRight = fleet.style.gridTemplateColumns.split(' ')[2];
      if (currentRight) localStorage.setItem('fleetRightWidth', parseInt(currentRight, 10));
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
})();

// --- Fleet: Pi list -------------------------------------------------------

const piTableBody = document.getElementById('piTableBody');
const targetSelect = document.getElementById('targetSelect');
const targetHint = document.getElementById('targetHint');
let pis = [];
let selectedPiId = null;

// Pi ids checked in the fleet table's select column. Independent of
// targetSelect's own value/DOM - this is what actually drives "multicast".
const checkedPiIds = new Set();

// Rebuilds the Target dropdown's options (all / multicast / one per Pi) and
// auto-switches to "multicast" the moment more than one Pi is checked in the
// table, per the requirement that multi-selecting Pis there should drive the
// dropdown rather than the other way around.
//
// Called on every 5s refreshPis() poll (fleet composition can change at any
// time), so this only touches the DOM - and only calls renderParamFields(),
// which wipes the whole param form - when something actually changed.
// Otherwise a field mid-edit (e.g. wifi SSID/password) gets reset out from
// under the user's typing every single poll.
let lastTargetOptionsKey = null;

function renderTargetSelect() {
  const current = targetSelect.value;
  const optionsKey = JSON.stringify([pis.map(p => p.pi_id), checkedPiIds.size > 1]);

  if (optionsKey !== lastTargetOptionsKey) {
    lastTargetOptionsKey = optionsKey;
    const options = ['<option value="all">all (broadcast)</option>'];
    if (checkedPiIds.size > 1) {
      options.push(`<option value="multicast">multicast (${checkedPiIds.size} selected)</option>`);
    }
    options.push(...pis.map(p => `<option value="${p.pi_id}">${p.pi_id}</option>`));
    targetSelect.innerHTML = options.join('');

    if (checkedPiIds.size > 1) {
      targetSelect.value = 'multicast';
    } else if ([...targetSelect.options].some(o => o.value === current)) {
      targetSelect.value = current;
    }
  }

  const isMulticast = targetSelect.value === 'multicast';
  targetHint.style.display = isMulticast ? 'block' : 'none';
  targetHint.textContent = isMulticast
    ? `Sends to the ${checkedPiIds.size} Pi(s) checked in the table above, each on its own configured primary interface.`
    : '';

  if (targetSelect.value !== current) renderParamFields();
}

// One entry per Pi: { summaryRow, logRow, logPanel, expanded, ws }.
// Kept alive across refreshPis() calls so expanding a row and its live
// log feed survive the 5s poll instead of being torn down and rebuilt.
const piRows = new Map();

function statusBadge(status) {
  const cls = status === 'online' ? 'badge-online' : status === 'offline' ? 'badge-offline' : 'badge-unassigned';
  return `<span class="badge ${cls}">${status}</span>`;
}

// Category -> which panel it's routed to. registration/status/result are
// command acks and fleet metadata, not something to show in a log feed.
const CATEGORY_PANEL = { logs: 'logPanel', tcpdump: 'tcpdumpPanel' };

function connectPiLog(piId, entry) {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  // Server-side filtered: the backend only forwards messages for this device_id.
  const ws = new WebSocket(`${proto}://${location.host}/ws/live/${encodeURIComponent(piId)}`);

  ws.onmessage = (event) => {
    let msg;
    try {
      msg = JSON.parse(event.data);
    } catch {
      return;
    }
    const panelKey = CATEGORY_PANEL[msg.category];
    if (!panelKey) return;
    const payload = msg.payload !== undefined ? msg.payload : msg;
    // tcpdump lines arrive batched (the Pi agent groups up to 50 lines or
    // 200ms of output into one MQTT message instead of publishing per
    // packet, to avoid flooding the MQTT client on busy interfaces) - other
    // categories still send one record per message.
    const lines = Array.isArray(payload) ? payload : [payload];

    const panel = entry[panelKey];
    const empty = panel.querySelector('.pi-log-empty');
    if (empty) empty.remove();
    lines.forEach(line => appendLineTo(panel, line));

    // Nothing is persisted server-side for these streams anymore, so a
    // capture in progress buffers lines here, live, as they arrive.
    const active = entry.captureState && entry.captureState[msg.category];
    if (active) lines.forEach(line => active.lines.push(line));
  };

  return ws;
}

// Each Pi has two independently-collapsible windows sharing one lazily
// opened WebSocket; the socket stays open as long as either is expanded.
const PANELS = [
  { kind: 'logs', rowKey: 'logRow', panelKey: 'logPanel', toggleKey: 'logToggle', expandedKey: 'logExpanded', label: 'syslog / stream_logs', short: 'syslog / stream_logs' },
  { kind: 'tcpdump', rowKey: 'tcpdumpRow', panelKey: 'tcpdumpPanel', toggleKey: 'tcpdumpToggle', expandedKey: 'tcpdumpExpanded', label: 'tcpdump', short: 'tcpdump' },
];

function anyExpanded(entry) {
  return PANELS.some(p => entry[p.expandedKey]);
}

// Polls a command until it's no longer pending and returns its result (or
// throws on failure/timeout), mirroring pollCommand() below but returning
// instead of rendering into the command-builder feed.
async function awaitCommandResult(commandId, maxAttempts = 30) {
  for (let i = 0; i < maxAttempts; i++) {
    const res = await fetch(`${API}/commands/${commandId}`);
    if (res.ok) {
      const data = await res.json();
      if (data.status === 'complete') return data.result;
      if (data.status === 'failed' || data.status === 'timeout') {
        throw new Error(data.result?.error || `command ${data.status}`);
      }
    }
    await new Promise(r => setTimeout(r, 1000));
  }
  throw new Error('timed out waiting for the Pi');
}

// Start/stop capture. Nothing is persisted server-side for either live
// stream until a capture is actually armed - for the tcpdump panel this
// records a real pcap file on the Pi (tcpdump -w, a separate process from
// the parsed-line stream that's only for on-page monitoring) and ships it
// back base64-encoded once stopped. For the syslog panel, lines are buffered
// client-side (see connectPiLog's ws.onmessage) for exactly the window
// between Start and Stop, then saved as a text capture - so the panel must
// stay expanded (WebSocket connected) for the whole capture, unlike the old
// DB-backed [since, now) approach.
async function toggleCapture(piId, spec, entry, btn) {
  if (spec.kind === 'tcpdump') return togglePcapCapture(piId, entry, btn);

  entry.captureState = entry.captureState || {};
  const active = entry.captureState[spec.kind];

  if (!active) {
    const name = prompt('Capture name:', `${piId}-${spec.kind}-${new Date().toISOString().slice(0, 19)}`);
    if (!name) return;
    entry.captureState[spec.kind] = { name, lines: [] };
    btn.innerHTML = '&#9209;';
    btn.title = 'Stop Capture';
    btn.classList.add('recording');
    return;
  }

  entry.captureState[spec.kind] = null;
  btn.innerHTML = '&#9210;';
  btn.title = 'Start Capture';
  btn.classList.remove('recording');
  btn.disabled = true;
  try {
    if (!active.lines.length) {
      alert('No logs arrived during that capture window.');
      return;
    }
    const res = await fetch(`${API}/captures`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pi_id: piId, category: spec.kind, name: active.name, lines: active.lines }),
    });
    if (!res.ok) {
      alert('Captured the logs but failed to save the file on the server.');
      return;
    }
    await loadCaptures();
  } catch {
    alert('Failed to save the capture.');
  } finally {
    btn.disabled = false;
  }
}

async function togglePcapCapture(piId, entry, btn) {
  const iface = entry.tcpdumpIfaceSelect ? entry.tcpdumpIfaceSelect.value : '';

  if (!entry.pcapState) {
    if (!iface) {
      alert('Select an interface for the tcpdump panel first.');
      return;
    }
    const name = prompt('Capture name:', `${piId}-pcap-${new Date().toISOString().slice(0, 19)}`);
    if (!name) return;

    btn.disabled = true;
    try {
      const res = await postCmd(piId, 'start_pcap_capture', { interface: iface, name });
      if (!res.ok) {
        alert('Failed to start PCAP capture.');
        return;
      }
      const data = await res.json();
      await awaitCommandResult(data.command_id);
    } catch (err) {
      alert(`Failed to start PCAP capture: ${err.message}`);
      return;
    } finally {
      btn.disabled = false;
    }

    entry.pcapState = { name, interface: iface };
    btn.innerHTML = '&#9209;';
    btn.title = 'Stop Capture';
    btn.classList.add('recording');
    return;
  }

  const { interface: capturedIface } = entry.pcapState;
  entry.pcapState = null;
  btn.innerHTML = '&#9210;';
  btn.title = 'Start Capture';
  btn.classList.remove('recording');
  btn.disabled = true;
  try {
    // The pcap has been streaming live to the backend since Start was
    // clicked (see start_pcap_capture on the Pi), so stopping only has to
    // tear down tcpdump and flush whatever's left in flight - not upload an
    // entire finished file - and should resolve quickly.
    const res = await postCmd(piId, 'stop_pcap_capture', { interface: capturedIface });
    if (!res.ok) {
      alert('Failed to stop PCAP capture.');
      return;
    }
    const data = await res.json();
    const result = await awaitCommandResult(data.command_id, 30);
    if (!result || !result.saved) {
      alert('PCAP capture stopped but was not saved on the server.');
      return;
    }
    await loadCaptures();
  } catch (err) {
    alert(`Failed to stop PCAP capture: ${err.message}`);
  } finally {
    btn.disabled = false;
  }
}

async function clearPanel(piId, spec, panel) {
  if (!confirm(`Clear ${spec.label} for ${piId}? This removes the saved history too.`)) return;
  try {
    await fetch(`${API}/pis/${encodeURIComponent(piId)}/logs?category=${encodeURIComponent(spec.kind)}`, {
      method: 'DELETE',
    });
  } catch {
    // ignore; still clear locally so the UI reflects the user's intent
  }
  panel.innerHTML = '<div class="pi-log-empty">waiting for messages…</div>';
}

const STREAM_START_ACTION = { logs: 'stream_logs', tcpdump: 'tcpdump' };
const STREAM_STOP_ACTION = { logs: 'stop_logs', tcpdump: 'stop_tcpdump' };

function postCmd(piId, action, params) {
  return fetch(`${API}/pis/${encodeURIComponent(piId)}/cmd`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, params }),
  });
}

// Called only from the explicit Watch/Stop button, never from picking an
// interface in the dropdown - selecting an interface is just choosing a
// target, it has no side effects on its own. Wipes the panel locally on
// every call, since re-pointing at a new interface would otherwise leave
// old lines from the previous one sitting alongside (or ahead of) new ones.
// Both streams are always scoped to exactly one interface - no unfiltered/
// "all interfaces" mode - so a panel never mixes lines from two NICs together.
// tcpdump can additionally run several interfaces at once server-side, so
// switching here also explicitly stops the previously watched one.
async function setStreamInterface(piId, entry, spec, interface_) {
  const panel = entry[spec.panelKey];
  panel.innerHTML = '<div class="pi-log-empty">waiting for messages…</div>';
  const prevIfaceKey = spec.kind + 'ActiveIface';
  const prevIface = entry[prevIfaceKey];
  try {
    if (prevIface && (spec.kind === 'tcpdump' ? prevIface !== interface_ : !interface_)) {
      await postCmd(piId, STREAM_STOP_ACTION[spec.kind], { interface: prevIface });
    }
    entry[prevIfaceKey] = interface_ || null;
    if (!interface_) return; // no interface selected - stream stays stopped
    await postCmd(piId, STREAM_START_ACTION[spec.kind], { interface: interface_ });
  } catch {
    // backend unreachable; panel is cleared locally regardless, next refresh will retry
  }
}

function togglePanel(piId, kind) {
  const entry = piRows.get(piId);
  if (!entry) return;
  const spec = PANELS.find(p => p.kind === kind);

  entry[spec.expandedKey] = !entry[spec.expandedKey];
  entry[spec.rowKey].classList.toggle('hidden', !entry[spec.expandedKey]);
  entry[spec.toggleKey].innerHTML = entry[spec.expandedKey] ? '&#9660; ' + spec.short : '&#9654; ' + spec.short;

  if (entry[spec.expandedKey] && !entry[spec.panelKey].children.length) {
    entry[spec.panelKey].innerHTML = '<div class="pi-log-empty">waiting for messages…</div>';
  }

  const isAnyExpanded = anyExpanded(entry);
  if (isAnyExpanded && !entry.ws) {
    entry.ws = connectPiLog(piId, entry);
  } else if (!isAnyExpanded && entry.ws) {
    entry.ws.close();
    entry.ws = null;
  }
}

function toggleRow(piId) {
  const entry = piRows.get(piId);
  if (!entry) return;
  entry.rowExpanded = !entry.rowExpanded;
  entry.toolbarRow.classList.toggle('hidden', !entry.rowExpanded);
  entry.mainToggle.innerHTML = entry.rowExpanded ? '&#9660;' : '&#9654;';

  // Collapsing the Pi row also collapses/tears down its log windows.
  if (!entry.rowExpanded) {
    PANELS.forEach(spec => {
      if (entry[spec.expandedKey]) {
        entry[spec.expandedKey] = false;
        entry[spec.rowKey].classList.add('hidden');
        entry[spec.toggleKey].innerHTML = '&#9654; ' + spec.short;
      }
    });
    if (entry.ws) {
      entry.ws.close();
      entry.ws = null;
    }
  }
}

function createPiRow(piId) {
  const summaryRow = document.createElement('tr');
  summaryRow.className = 'pi-row';
  summaryRow.dataset.piId = piId;
  summaryRow.innerHTML = `
    <td><input type="checkbox" class="pi-select-checkbox" title="Select for multicast"></td>
    <td><span class="pi-toggle main-toggle">&#9654;</span></td>
    <td class="c-id"></td>
    <td class="c-ip"></td>
    <td class="c-role"></td>
    <td class="c-status"></td>
    <td class="c-seen"></td>
    <td class="c-primary-if"><select class="field primary-if-select"><option value="">(none)</option></select></td>
  `;
  const mainToggle = summaryRow.querySelector('.main-toggle');
  mainToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleRow(piId);
  });
  summaryRow.addEventListener('click', () => {
    selectedPiId = piId;
    targetSelect.value = piId;
    renderParamFields();
    piRows.forEach((entry, id) => entry.summaryRow.classList.toggle('selected', id === selectedPiId));
  });

  // Multi-select checkbox: independent of the row-click single target above,
  // this drives the "multicast" target - checking more than one Pi here
  // auto-switches the Target dropdown to multicast (see renderTargetSelect).
  const selectCheckbox = summaryRow.querySelector('.pi-select-checkbox');
  selectCheckbox.addEventListener('click', (e) => e.stopPropagation());
  selectCheckbox.addEventListener('change', () => {
    if (selectCheckbox.checked) checkedPiIds.add(piId);
    else checkedPiIds.delete(piId);
    renderTargetSelect();
  });

  // Per-Pi primary interface, used as the target interface when this Pi is
  // included in a multicast command - configured here, not per-command.
  const primaryIfaceSelect = summaryRow.querySelector('.primary-if-select');
  primaryIfaceSelect.addEventListener('click', (e) => e.stopPropagation());
  primaryIfaceSelect.addEventListener('change', async () => {
    primaryIfaceSelect.disabled = true;
    try {
      const res = await fetch(`${API}/pis/${encodeURIComponent(piId)}/primary-interface`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ primary_interface: primaryIfaceSelect.value || null }),
      });
      if (!res.ok) {
        alert('Failed to set primary interface.');
        return;
      }
      const updated = await res.json();
      const pi = pis.find(p => p.pi_id === piId);
      if (pi) pi.primary_interface = updated.primary_interface;
    } catch {
      alert('Failed to set primary interface.');
    } finally {
      primaryIfaceSelect.disabled = false;
    }
  });

  // Toolbar row: only visible once the Pi row itself is expanded; holds the
  // per-stream toggles that open the actual log windows below it.
  const toolbarRow = document.createElement('tr');
  toolbarRow.className = 'pi-toolbar-row hidden';
  const toolbarCell = document.createElement('td');
  toolbarCell.colSpan = 8;
  toolbarCell.innerHTML = PANELS.map(spec =>
    `<span class="pi-toggle" data-kind="${spec.kind}">&#9654; ${spec.short}</span>`
  ).join('');
  toolbarRow.appendChild(toolbarCell);
  toolbarCell.querySelectorAll('.pi-toggle').forEach(toggle => {
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePanel(piId, toggle.dataset.kind);
    });
  });

  const entry = { summaryRow, mainToggle, toolbarRow, primaryIfaceSelect, rowExpanded: false, ws: null };
  PANELS.forEach(spec => {
    const row = document.createElement('tr');
    row.className = 'pi-log-row hidden';
    const cell = document.createElement('td');
    cell.colSpan = 8;
    cell.innerHTML = `
      <div class="pi-log-heading">
        <span>${spec.label}</span>
        <span class="pi-log-actions">
          <select class="pi-stream-iface"><option value="">select interface</option></select>
          <button class="pi-log-capture icon-btn" type="button" title="Start Capture">&#9210;</button>
          <button class="pi-log-clear icon-btn" type="button" title="Clear">&#128465;</button>
        </span>
      </div>
      <div class="pi-log-panel"></div>
    `;
    row.appendChild(cell);

    entry[spec.rowKey] = row;
    entry[spec.panelKey] = cell.querySelector('.pi-log-panel');
    entry[spec.toggleKey] = toolbarCell.querySelector(`.pi-toggle[data-kind="${spec.kind}"]`);
    entry[spec.expandedKey] = false;

    const ifaceSelect = cell.querySelector('.pi-stream-iface');
    entry[spec.kind + 'IfaceSelect'] = ifaceSelect;
    ifaceSelect.addEventListener('click', (e) => e.stopPropagation());
    if (spec.kind === 'tcpdump') {
      // tcpdump streaming is only ever started/stopped through the Action
      // command builder now - this select exists purely to pick which
      // interface a PCAP capture (Start Capture button) targets, it has no
      // side effects of its own.
    } else {
      ifaceSelect.addEventListener('change', (e) => {
        setStreamInterface(piId, entry, spec, e.target.value);
      });
    }

    const captureBtn = cell.querySelector('.pi-log-capture');
    captureBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleCapture(piId, spec, entry, captureBtn);
    });
    cell.querySelector('.pi-log-clear').addEventListener('click', (e) => {
      e.stopPropagation();
      clearPanel(piId, spec, entry[spec.panelKey]);
    });
  });

  return entry;
}

function renderPis() {
  const seen = new Set();

  pis.forEach(p => {
    seen.add(p.pi_id);
    let entry = piRows.get(p.pi_id);
    if (!entry) {
      entry = createPiRow(p.pi_id);
      piRows.set(p.pi_id, entry);
      piTableBody.appendChild(entry.summaryRow);
      piTableBody.appendChild(entry.toolbarRow);
      piTableBody.appendChild(entry.logRow);
      piTableBody.appendChild(entry.tcpdumpRow);
    }
    entry.summaryRow.classList.toggle('selected', p.pi_id === selectedPiId);
    entry.summaryRow.querySelector('.c-id').textContent = p.pi_id;
    entry.summaryRow.querySelector('.c-ip').textContent = p.ip_address || '';
    entry.summaryRow.querySelector('.c-role').textContent = p.role || '';
    entry.summaryRow.querySelector('.c-status').innerHTML = statusBadge(p.status);
    entry.summaryRow.querySelector('.c-seen').textContent = p.last_seen ? new Date(p.last_seen).toLocaleString() : '';
    entry.summaryRow.querySelector('.pi-select-checkbox').checked = checkedPiIds.has(p.pi_id);

    const interfaces = (p.metadata && Array.isArray(p.metadata.interfaces)) ? p.metadata.interfaces : [];
    const key = JSON.stringify(interfaces);
    PANELS.forEach(spec => {
      const select = entry[spec.kind + 'IfaceSelect'];
      const keyProp = spec.kind + 'IfaceKey';
      if (!select || entry[keyProp] === key) return;
      entry[keyProp] = key;
      const current = select.value;
      select.innerHTML = '<option value="">select interface</option>' +
        interfaces.map(i => `<option value="${i}">${i}</option>`).join('');
      if (interfaces.includes(current)) select.value = current;
    });

    // The primary-interface select is config, not a live filter - its value
    // always mirrors the server's p.primary_interface, options rebuilt only
    // when the underlying interface list actually changes.
    if (entry.primaryIfaceKey !== key) {
      entry.primaryIfaceKey = key;
      entry.primaryIfaceSelect.innerHTML = '<option value="">(none)</option>' +
        interfaces.map(i => `<option value="${i}">${i}</option>`).join('');
    }
    if (entry.primaryIfaceSelect.value !== (p.primary_interface || '')) {
      entry.primaryIfaceSelect.value = p.primary_interface || '';
    }
  });

  // Drop rows for Pis that disappeared, closing any open log socket.
  [...piRows.keys()].forEach(id => {
    if (seen.has(id)) return;
    const entry = piRows.get(id);
    if (entry.ws) entry.ws.close();
    entry.summaryRow.remove();
    entry.toolbarRow.remove();
    entry.logRow.remove();
    entry.tcpdumpRow.remove();
    piRows.delete(id);
  });

  [...checkedPiIds].forEach(id => { if (!seen.has(id)) checkedPiIds.delete(id); });
  renderTargetSelect();

  if (typeof refreshInterfaceOptions === 'function') refreshInterfaceOptions();
}

async function refreshPis() {
  try {
    const res = await fetch(`${API}/pis`);
    if (!res.ok) return;
    pis = await res.json();
    renderPis();
  } catch {
    // backend unreachable; keep last known list
  }
}

refreshPis();
setInterval(refreshPis, 5000);

const actionSelect = document.getElementById('actionSelect');
const paramFields = document.getElementById('paramFields');
const sendCmdBtn = document.getElementById('sendCmdBtn');
const cmdResults = document.getElementById('cmdResults');

const ACTION_PARAMS = {
  ping: [
    { name: 'interface', label: 'Interface (optional)', type: 'interface' },
    { name: 'target', label: 'IP to ping', type: 'text', default: '8.8.8.8' },
    { name: 'count', label: 'Count', type: 'number', default: 5 },
  ],
  signal_stats: [],
  band_channel_info: [{ name: 'interface', label: 'Interface', type: 'interface', required: true }],
  throughput_test: [{ name: 'duration', label: 'Duration (s)', type: 'number', default: 10 }],
  set_channel: [{ name: 'channel', label: 'Channel', type: 'number' }],
  syslog: [{ name: 'lines', label: 'Lines', type: 'number', default: 100 }],
  stream_logs: [{ name: 'interface', label: 'Interface', type: 'interface', required: true }],
  stop_logs: [],
  tcpdump: [{ name: 'interface', label: 'Interface', type: 'interface', required: true }],
  stop_tcpdump: [{ name: 'interface', label: 'Interface', type: 'interface', required: true }],
  connect_wifi: [
    { name: 'ssid', label: 'SSID (ignored if BSSID is set)', type: 'text' },
    { name: 'bssid', label: 'BSSID (optional - overrides SSID)', type: 'text' },
    { name: 'password', label: 'Password (optional)', type: 'password' },
    { name: 'channel', label: 'Channel (optional - pins band+channel, ignored with BSSID)', type: 'number' },
    { name: 'interface', label: 'Interface', type: 'interface', required: true },
  ],
  disconnect_wifi: [{ name: 'interface', label: 'Interface', type: 'interface', required: true }],
  list_interfaces: [],
  list_interface_ips: [],
};

function currentTargetInterfaces() {
  const target = targetSelect.value;
  if (!target || target === 'all' || target === 'multicast') return [];
  const pi = pis.find(p => p.pi_id === target);
  return (pi && pi.metadata && Array.isArray(pi.metadata.interfaces)) ? pi.metadata.interfaces : [];
}

function renderParamFields() {
  const fields = ACTION_PARAMS[actionSelect.value] || [];
  const interfaces = currentTargetInterfaces();
  const isMulticast = targetSelect.value === 'multicast';
  paramFields.innerHTML = fields.map(f => {
    if (f.type === 'interface') {
      // In multicast mode the interface isn't picked here at all - each
      // targeted Pi's own configured primary interface is used instead.
      if (isMulticast) {
        return `<label>${f.label}</label><div class="hint">Auto: each Pi's configured primary interface</div>`;
      }
      const options = ['<option value="">' + (f.required ? 'select interface' : '(none)') + '</option>']
        .concat(interfaces.map(i => `<option value="${i}">${i}</option>`));
      return `<label>${f.label}</label><select class="field" data-param="${f.name}">${options.join('')}</select>`;
    }
    return `
      <label>${f.label}</label>
      <input class="field" data-param="${f.name}" type="${f.type}" ${f.default !== undefined ? `value="${f.default}"` : ''}>
    `;
  }).join('');
}

let lastRenderedInterfacesKey = null;

function refreshInterfaceOptions() {
  const interfaces = currentTargetInterfaces();
  const key = JSON.stringify(interfaces);
  if (key === lastRenderedInterfacesKey) return;
  lastRenderedInterfacesKey = key;

  paramFields.querySelectorAll('select[data-param]').forEach(select => {
    const fields = ACTION_PARAMS[actionSelect.value] || [];
    const field = fields.find(f => f.name === select.dataset.param);
    if (!field || field.type !== 'interface') return;
    const current = select.value;
    const options = ['<option value="">' + (field.required ? 'select interface' : '(none)') + '</option>']
      .concat(interfaces.map(i => `<option value="${i}">${i}</option>`));
    select.innerHTML = options.join('');
    if (interfaces.includes(current)) select.value = current;
  });
}

actionSelect.addEventListener('change', renderParamFields);
targetSelect.addEventListener('change', renderParamFields);
renderTargetSelect();
renderParamFields();

function collectParams() {
  const params = {};
  paramFields.querySelectorAll('[data-param]').forEach(input => {
    if (input.value === '') return;
    params[input.dataset.param] = input.type === 'number' ? Number(input.value) : input.value;
  });
  return params;
}

function addCommandEntry(commandId, piId, action, restored) {
  const entry = document.createElement('div');
  entry.className = 'cmd-entry';
  entry.dataset.commandId = commandId;
  entry.innerHTML = `
    <div class="hdr"><span><span class="toggle">&#9660;</span>${action} &rarr; ${piId}</span><span><span class="cmd-status pending">pending</span><button class="icon-btn cmd-delete" title="Delete">&#128465;</button></span></div>
    <div class="result"></div>
  `;
  entry.querySelector('.hdr').addEventListener('click', (e) => {
    if (e.target.closest('.cmd-delete')) return;
    entry.classList.toggle('collapsed');
    entry.querySelector('.toggle').innerHTML = entry.classList.contains('collapsed') ? '&#9654;' : '&#9660;';
  });
  entry.querySelector('.cmd-delete').addEventListener('click', async (e) => {
    e.stopPropagation();
    try {
      // keepalive so the request still lands even if the page reloads/closes
      // right after the click - otherwise a quick reload can beat the DELETE
      // to the server and the "deleted" command reappears on next load.
      const res = await fetch(`${API}/commands/${commandId}`, { method: 'DELETE', keepalive: true });
      if (!res.ok && res.status !== 404) {
        alert('Failed to delete command on the server; it may reappear on reload.');
        return;
      }
    } catch {
      alert('Failed to delete command on the server; it may reappear on reload.');
      return;
    }
    entry.remove();
  });
  cmdResults.prepend(entry);

  if (restored && restored.status !== 'pending') {
    const statusEl = entry.querySelector('.cmd-status');
    statusEl.textContent = restored.status;
    statusEl.className = `cmd-status ${restored.status}`;
    if (restored.result) renderResultTable(entry.querySelector('.result'), restored.result);
  } else {
    pollCommand(commandId, entry, piId, action);
  }
}

async function loadCommandHistory() {
  try {
    const res = await fetch(`${API}/commands?limit=50`);
    if (!res.ok) return;
    const commands = await res.json();
    // Server returns newest-first; add oldest-to-newest so repeated
    // prepend() calls land the newest command back on top, as if each
    // had just been issued in that order.
    commands.slice().reverse().forEach(c => {
      addCommandEntry(c.command_id, c.pi_id, c.action, c);
    });
  } catch {
    // backend unreachable; command feed just starts empty
  }
}

loadCommandHistory();

function formatResultValue(value) {
  if (value === null || value === undefined) return '';
  if (Array.isArray(value)) {
    const allPrimitive = value.every(v => v === null || typeof v !== 'object');
    if (allPrimitive && value.length <= 5) return value.join(', ') || '(empty)';
    return `${value.length} item${value.length === 1 ? '' : 's'}`;
  }
  const str = String(value);
  return str.length > 200 ? `${str.slice(0, 200)}… (${str.length} chars)` : str;
}

// A "flat" object has no nested objects/arrays of its own - safe to put on
// one table row without recursing further.
function isFlatObject(v) {
  return v !== null && typeof v === 'object' && !Array.isArray(v) &&
    Object.values(v).every(x => x === null || typeof x !== 'object');
}

// Arrays of flat objects (e.g. band_channel_info's channel lists) render as
// one compact table with a column per key, instead of one full indexed
// key-value sub-table per element - the latter is unreadable for anything
// more than 2-3 items (a 40-channel list becomes ~200 rows of noise).
function renderCompactArrayTable(container, arr) {
  const keys = [...new Set(arr.flatMap(o => Object.keys(o)))];
  const table = document.createElement('table');
  table.className = 'result-table result-array-table';
  const headRow = document.createElement('tr');
  keys.forEach(k => {
    const th = document.createElement('th');
    th.textContent = k;
    headRow.appendChild(th);
  });
  table.appendChild(headRow);
  arr.forEach(obj => {
    const row = document.createElement('tr');
    keys.forEach(k => {
      const td = document.createElement('td');
      td.textContent = formatResultValue(obj[k]);
      row.appendChild(td);
    });
    table.appendChild(row);
  });
  container.appendChild(table);
}

function renderResultTable(container, obj) {
  container.innerHTML = '';
  if (obj === null || typeof obj !== 'object') {
    container.textContent = JSON.stringify(obj);
    return;
  }
  if (Array.isArray(obj) && obj.length && obj.every(isFlatObject)) {
    renderCompactArrayTable(container, obj);
    return;
  }
  const table = document.createElement('table');
  table.className = 'result-table';
  // Arrays of objects (e.g. band_channel_info's bands) get their own indexed
  // rows instead of collapsing to "N items" - otherwise nested structured
  // data like that is invisible in the result view.
  const entries = Array.isArray(obj) ? obj.map((v, i) => [i, v]) : Object.entries(obj);
  entries.forEach(([key, value]) => {
    const isExpandable = value !== null && typeof value === 'object' &&
      (!Array.isArray(value) || value.some(v => v !== null && typeof v === 'object'));

    if (isExpandable) {
      // A nested table (e.g. a band's channel list) needs the full row
      // width to be readable - cramming it into a value cell next to its
      // label produces a squeezed, unreadable mess. Give the label its own
      // full-width row, then the nested content its own full-width row.
      const labelRow = document.createElement('tr');
      const labelCell = document.createElement('td');
      labelCell.className = 'result-key result-nested-label';
      labelCell.colSpan = 2;
      labelCell.textContent = key;
      labelRow.appendChild(labelCell);
      table.appendChild(labelRow);

      const nestedRow = document.createElement('tr');
      const nestedCell = document.createElement('td');
      nestedCell.className = 'result-nested';
      nestedCell.colSpan = 2;
      renderResultTable(nestedCell, value);
      nestedRow.appendChild(nestedCell);
      table.appendChild(nestedRow);
    } else {
      const row = document.createElement('tr');
      const keyCell = document.createElement('td');
      keyCell.className = 'result-key';
      keyCell.textContent = key;
      const valCell = document.createElement('td');
      valCell.className = 'result-value';
      valCell.textContent = formatResultValue(value);
      row.append(keyCell, valCell);
      table.appendChild(row);
    }
  });
  container.appendChild(table);
}

function pushToPiLogPanel(piId, lines) {
  if (piId === 'all') return;
  let entry = piRows.get(piId);
  if (!entry) return;
  const empty = entry.logPanel.querySelector('.pi-log-empty');
  if (empty) empty.remove();
  lines.forEach(line => appendLineTo(entry.logPanel, line));
}

async function pollCommand(commandId, entry, piId, action) {
  const statusEl = entry.querySelector('.cmd-status');
  const resultEl = entry.querySelector('.result');
  for (let i = 0; i < 30; i++) {
    try {
      const res = await fetch(`${API}/commands/${commandId}`);
      if (res.ok) {
        const data = await res.json();
        statusEl.textContent = data.status;
        statusEl.className = `cmd-status ${data.status}`;
        if (data.result) renderResultTable(resultEl, data.result);
        if (data.status === 'complete' && action === 'syslog' && Array.isArray(data.result?.logs)) {
          pushToPiLogPanel(piId, data.result.logs);
        }
        if (data.status !== 'pending') return;
      }
    } catch {
      // ignore transient errors and keep polling
    }
    await new Promise(r => setTimeout(r, 2000));
  }
}

async function sendOneCommand(url, action, params) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, params }),
  });
  if (!res.ok) {
    const text = await res.text();
    throw new Error(`${res.status} ${text}`);
  }
  const data = await res.json();
  addCommandEntry(data.command_id, data.pi_id, data.action);
}

sendCmdBtn.addEventListener('click', async () => {
  const target = targetSelect.value;
  const action = actionSelect.value;
  const params = collectParams();

  sendCmdBtn.disabled = true;
  try {
    if (target === 'all') {
      await sendOneCommand(`${API}/pis/broadcast`, action, params);
    } else if (target === 'multicast') {
      const targetIds = [...checkedPiIds];
      if (!targetIds.length) {
        alert('No Pis checked in the table for multicast.');
        return;
      }
      const needsInterface = (ACTION_PARAMS[action] || []).some(f => f.type === 'interface');
      // One command per checked Pi, dispatched independently (no backend
      // concept of "send to this subset" to piggyback on), each using that
      // Pi's own configured primary interface rather than one shared value.
      const results = await Promise.allSettled(targetIds.map(piId => {
        const pi = pis.find(p => p.pi_id === piId);
        if (needsInterface && !(pi && pi.primary_interface)) {
          return Promise.reject(new Error(`${piId}: no primary interface configured`));
        }
        const perPiParams = needsInterface ? { ...params, interface: pi.primary_interface } : params;
        return sendOneCommand(`${API}/pis/${encodeURIComponent(piId)}/cmd`, action, perPiParams);
      }));
      const failed = results.filter(r => r.status === 'rejected');
      if (failed.length) {
        alert(`${failed.length} of ${targetIds.length} command(s) failed to send:\n` +
          failed.map(r => r.reason.message).join('\n'));
      }
    } else {
      await sendOneCommand(`${API}/pis/${encodeURIComponent(target)}/cmd`, action, params);
    }
  } catch (err) {
    alert(`Command failed: ${err.message}`);
  } finally {
    sendCmdBtn.disabled = false;
  }
});

// --- Shared log line rendering (used by per-Pi log panels) -----------------

function levelClass(level) {
  const l = (level || 'unknown').toLowerCase();
  return ['info', 'warning', 'error'].includes(l) ? `lvl-${l}` : 'lvl-unknown';
}

function buildLineElement(payload) {
  const div = document.createElement('div');
  div.className = 'line';

  if (typeof payload === 'string') {
    // Raw journalctl/tcpdump line - no structured fields, just show it as-is.
    const msg = document.createElement('span');
    msg.className = 'msg';
    msg.textContent = payload;
    div.append(msg);
  } else {
    const ts = document.createElement('span');
    ts.className = 'ts';
    ts.textContent = payload.timestamp || '';

    const lvl = document.createElement('span');
    const levelValue = payload.loglevel || payload.level || 'unknown';
    lvl.className = `lvl ${levelClass(levelValue)}`;
    lvl.textContent = levelValue;

    const msg = document.createElement('span');
    msg.className = 'msg';
    msg.textContent = payload.message !== undefined ? payload.message : JSON.stringify(payload);

    div.append(ts, lvl, msg);
  }
  return div;
}

// A busy tcpdump/syslog stream can push many messages per second; appending
// and re-measuring scroll position (a forced synchronous reflow) on every
// single one causes layout thrashing bad enough to stall the main thread and
// make unrelated UI (button clicks) feel like they hung. Instead, lines are
// queued and flushed together at most once per animation frame, so a burst
// of N messages costs one DOM batch + one layout read instead of N of each.
const linePanelQueues = new WeakMap();

function appendLineTo(container, payload) {
  let state = linePanelQueues.get(container);
  if (!state) {
    state = { queue: [], scheduled: false };
    linePanelQueues.set(container, state);
  }
  state.queue.push(payload);
  if (!state.scheduled) {
    state.scheduled = true;
    requestAnimationFrame(() => flushLineQueue(container, state));
  }
}

function flushLineQueue(container, state) {
  state.scheduled = false;
  const lines = state.queue;
  state.queue = [];
  if (!lines.length) return;

  const frag = document.createDocumentFragment();
  lines.forEach(payload => frag.appendChild(buildLineElement(payload)));
  container.appendChild(frag);

  // Cap growth so a long-running stream (tcpdump, syslog) doesn't leak memory.
  while (container.children.length > 500) container.removeChild(container.firstChild);

  const nearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 100;
  if (nearBottom) container.scrollTop = container.scrollHeight;
}

</script>
</body>
