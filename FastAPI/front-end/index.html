// --- History: persisted command results (view + delete only - this is not
// the live per-session feed under the Actions/command builder panels, which
// now always starts empty on page load; this is the durable record kept in
// the backend, browsable and prunable on its own). ------------------------

const historyTableBody = document.getElementById('historyTableBody');
const historySelectAll = document.getElementById('historySelectAll');
const historyDeleteSelectedBtn = document.getElementById('historyDeleteSelectedBtn');
const checkedHistoryIds = new Set();

function updateHistoryDeleteBtn() {
  historyDeleteSelectedBtn.disabled = checkedHistoryIds.size === 0;
  historyDeleteSelectedBtn.title = checkedHistoryIds.size
    ? `Delete selected (${checkedHistoryIds.size})`
    : 'Delete selected';
}

function syncHistorySelectAll() {
  const checkboxes = [...historyTableBody.querySelectorAll('.history-select-checkbox')];
  historySelectAll.checked = checkboxes.length > 0 && checkboxes.every(cb => cb.checked);
  historySelectAll.indeterminate = checkboxes.some(cb => cb.checked) && !historySelectAll.checked;
}

async function deleteHistoryEntries(ids) {
  const results = await Promise.allSettled(ids.map(id =>
    apiFetch(`${API}/commands/${id}`, { method: 'DELETE', keepalive: true })
  ));
  const failed = results.filter(r => r.status === 'rejected' || !r.value.ok && r.value.status !== 404);
  ids.forEach(id => checkedHistoryIds.delete(id));
  if (failed.length) alert(`${failed.length} of ${ids.length} failed to delete; they may reappear on reload.`);
  await loadHistory();
}

async function loadHistory() {
  try {
    const res = await apiFetch(`${API}/commands?limit=200`);
    if (!res.ok) return;
    const commands = await res.json();
    const seenIds = new Set(commands.map(c => c.command_id));
    [...checkedHistoryIds].forEach(id => { if (!seenIds.has(id)) checkedHistoryIds.delete(id); });

    historyTableBody.innerHTML = commands.map(c => `
      <tr class="history-row" data-command-id="${c.command_id}">
        <td><input type="checkbox" class="history-select-checkbox" ${checkedHistoryIds.has(c.command_id) ? 'checked' : ''}></td>
        <td>${c.pi_id}</td>
        <td>${actionLabel(c.action)}</td>
        <td><span class="cmd-status ${c.status}">${c.status}</span></td>
        <td>${new Date(c.created_at).toLocaleString()}</td>
        <td class="capture-actions">
          <button class="icon-btn history-toggle" title="Show result">&#9654;</button>
          <button class="icon-btn history-delete" data-command-id="${c.command_id}" title="Delete">&#128465;</button>
        </td>
      </tr>
      <tr class="history-detail-row hidden" data-command-id="${c.command_id}"><td colspan="6"><div class="result"></div></td></tr>
    `).join('') || '<tr><td colspan="6" class="pi-log-empty">no command history yet</td></tr>';

    historyTableBody.querySelectorAll('.history-select-checkbox').forEach(cb => {
      const id = cb.closest('tr').dataset.commandId;
      cb.addEventListener('change', () => {
        if (cb.checked) checkedHistoryIds.add(id); else checkedHistoryIds.delete(id);
        syncHistorySelectAll();
        updateHistoryDeleteBtn();
      });
    });

    historyTableBody.querySelectorAll('.history-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.closest('tr').dataset.commandId;
        const detailRow = historyTableBody.querySelector(`.history-detail-row[data-command-id="${id}"]`);
        const expanding = detailRow.classList.contains('hidden');
        detailRow.classList.toggle('hidden');
        btn.innerHTML = expanding ? '&#9660;' : '&#9654;';
        if (!expanding) return;
        const command = commands.find(c => c.command_id === id);
        const resultEl = detailRow.querySelector('.result');
        if (command && command.result) renderCommandResult(resultEl, command.action, command.result);
        else resultEl.innerHTML = '<div class="pi-log-empty">no result</div>';
      });
    });

    historyTableBody.querySelectorAll('.history-delete').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await deleteHistoryEntries([btn.dataset.commandId]);
        } finally {
          updateHistoryDeleteBtn();
        }
      });
    });

    syncHistorySelectAll();
    updateHistoryDeleteBtn();
  } catch {
    // backend unreachable; leave the last known list in place
  }
}

historySelectAll.addEventListener('change', () => {
  historyTableBody.querySelectorAll('.history-select-checkbox').forEach(cb => {
    cb.checked = historySelectAll.checked;
    const id = cb.closest('tr').dataset.commandId;
    if (cb.checked) checkedHistoryIds.add(id); else checkedHistoryIds.delete(id);
  });
  updateHistoryDeleteBtn();
});

historyDeleteSelectedBtn.addEventListener('click', async () => {
  const ids = [...checkedHistoryIds];
  if (!ids.length) return;
  if (!confirm(`Delete ${ids.length} command result(s)? This cannot be undone.`)) return;
  historyDeleteSelectedBtn.disabled = true;
  await deleteHistoryEntries(ids);
});

loadHistory();

// --- Fleet: command builder ------------------------------------------------

const actionSelect = document.getElementById('actionSelect');
const paramFields = document.getElementById('paramFields');
const sendCmdBtn = document.getElementById('sendCmdBtn');
const cmdResults = document.getElementById('cmdResults');

const ACTION_PARAMS = {
  ping: [
    { name: 'interface', label: 'Interface (optional)', type: 'interface' },
    { name: 'target', label: 'IP to ping', type: 'text', default: '8.8.8.8' },
    { name: 'count', label: 'Count', type: 'number', default: 5 },
  ],
  signal_stats: [],
  band_channel_info: [{ name: 'interface', label: 'Interface', type: 'interface', required: true }],
  link_info: [{ name: 'interface', label: 'Interface', type: 'interface', required: true }],
  throughput_test: [{ name: 'duration', label: 'Duration (s)', type: 'number', default: 10 }],
  set_channel: [{ name: 'channel', label: 'Channel', type: 'number' }],
  syslog: [{ name: 'lines', label: 'Lines', type: 'number', default: 100 }],
  stream_logs: [{ name: 'interface', label: 'Interface', type: 'interface', required: true }],
  stop_logs: [],
  tcpdump: [{ name: 'interface', label: 'Interface', type: 'interface', required: true }],
  stop_tcpdump: [{ name: 'interface', label: 'Interface', type: 'interface', required: true }],
  connect_wifi: [
    { name: 'ssid', label: 'SSID (ignored if BSSID is set)', type: 'text' },
    { name: 'bssid', label: 'BSSID (optional - overrides SSID)', type: 'text' },
    { name: 'password', label: 'Password (optional)', type: 'password' },
    { name: 'channel', label: 'Channel (optional - pins band+channel, ignored with BSSID)', type: 'number' },
    { name: 'interface', label: 'Interface', type: 'interface', required: true },
  ],
  disconnect_wifi: [{ name: 'interface', label: 'Interface', type: 'interface', required: true }],
  list_interfaces: [],
  scan_wifi: [{ name: 'interface', label: 'Interface', type: 'interface', required: true }],
};

function currentTargetInterfaces() {
  const target = targetSelect.value;
  if (!target || target === 'all' || target === 'multicast') return [];
  const pi = pis.find(p => p.pi_id === target);
  return (pi && pi.metadata && Array.isArray(pi.metadata.interfaces)) ? pi.metadata.interfaces : [];
}

function renderParamFields() {
  const fields = ACTION_PARAMS[actionSelect.value] || [];
  const interfaces = currentTargetInterfaces();
  const isMulticast = targetSelect.value === 'multicast';
  paramFields.innerHTML = fields.map(f => {
    if (f.type === 'interface') {
      // In multicast mode interfaces aren't picked here at all - each
      // targeted Pi's own configured primary interfaces are used instead,
      // fanning out one command per (Pi, interface) pair.
      if (isMulticast) {
        return `<label>${f.label}</label><div class="hint">Auto: each Pi's configured primary interface(s)</div>`;
      }
      return `<label>${f.label}</label><div class="iface-dropdown-mount" data-param="${f.name}"></div>`;
    }
    if (f.type === 'password') {
      return `
        <label>${f.label}</label>
        <div class="password-wrap">
          <input class="field" data-param="${f.name}" type="password" ${f.default !== undefined ? `value="${f.default}"` : ''}>
          <button type="button" class="password-toggle" title="Show password">&#128065;</button>
        </div>
      `;
    }
    return `
      <label>${f.label}</label>
      <input class="field" data-param="${f.name}" type="${f.type}" ${f.default !== undefined ? `value="${f.default}"` : ''}>
    `;
  }).join('');

  // The dropdown widget is real DOM built by JS, not a string - each mount
  // placeholder above gets replaced by a freshly built one, carrying the
  // data-param over so collectParams() can still find it by name.
  paramFields.querySelectorAll('.iface-dropdown-mount[data-param]').forEach(mount => {
    const box = buildIfaceDropdown();
    box.dataset.param = mount.dataset.param;
    setDropdownOptions(box, interfaces, []);
    mount.replaceWith(box);
  });
}

let lastRenderedInterfacesKey = null;

function refreshInterfaceOptions() {
  const interfaces = currentTargetInterfaces();
  const key = JSON.stringify(interfaces);
  if (key === lastRenderedInterfacesKey) return;
  lastRenderedInterfacesKey = key;

  paramFields.querySelectorAll('.iface-dropdown[data-param]').forEach(box => {
    const current = getDropdownSelected(box);
    setDropdownOptions(box, interfaces, current.filter(v => interfaces.includes(v)));
  });
}

actionSelect.addEventListener('change', renderParamFields);
targetSelect.addEventListener('change', renderParamFields);
renderTargetSelect();
renderParamFields();

// Multi-value params (currently just "interface") collect into an array;
// everything else stays a single scalar value, same as before.
function collectParams() {
  const params = {};
  paramFields.querySelectorAll('[data-param]').forEach(el => {
    const name = el.dataset.param;
    if (el.classList.contains('iface-dropdown')) {
      const selected = getDropdownSelected(el);
      if (selected.length) params[name] = selected;
      return;
    }
    if (el.value === '') return;
    params[name] = el.type === 'number' ? Number(el.value) : el.value;
  });
  return params;
}

function addCommandEntry(commandId, piId, action) {
  const entry = document.createElement('div');
  entry.className = 'cmd-entry';
  entry.dataset.commandId = commandId;
  entry.innerHTML = `
    <div class="hdr"><span><span class="toggle">&#9660;</span>${action} &rarr; ${piId}</span><span><span class="cmd-status pending">pending</span><button class="icon-btn cmd-delete" title="Delete">&#128465;</button></span></div>
    <div class="result"></div>
  `;
  entry.querySelector('.hdr').addEventListener('click', (e) => {
    if (e.target.closest('.cmd-delete')) return;
    entry.classList.toggle('collapsed');
    entry.querySelector('.toggle').innerHTML = entry.classList.contains('collapsed') ? '&#9654;' : '&#9660;';
  });
  entry.querySelector('.cmd-delete').addEventListener('click', async (e) => {
    e.stopPropagation();
    try {
      // keepalive so the request still lands even if the page reloads/closes
      // right after the click - otherwise a quick reload can beat the DELETE
      // to the server and the "deleted" command reappears on next load.
      const res = await apiFetch(`${API}/commands/${commandId}`, { method: 'DELETE', keepalive: true });
      if (!res.ok && res.status !== 404) {
        alert('Failed to delete command on the server; it may reappear on reload.');
        return;
      }
    } catch {
      alert('Failed to delete command on the server; it may reappear on reload.');
      return;
    }
    entry.remove();
  });
  cmdResults.prepend(entry);
  pollCommand(commandId, entry, piId, action);
}

function formatResultValue(value) {
  if (value === null || value === undefined) return '';
  if (Array.isArray(value)) {
    const allPrimitive = value.every(v => v === null || typeof v !== 'object');
    if (allPrimitive && value.length <= 5) return value.join(', ') || '(empty)';
    return `${value.length} item${value.length === 1 ? '' : 's'}`;
  }
  const str = String(value);
  return str.length > 200 ? `${str.slice(0, 200)}… (${str.length} chars)` : str;
}

// A "flat" object has no nested objects/arrays of its own - safe to put on
// one table row without recursing further.
function isFlatObject(v) {
  return v !== null && typeof v === 'object' && !Array.isArray(v) &&
    Object.values(v).every(x => x === null || typeof x !== 'object');
}

// Arrays of flat objects (e.g. band_channel_info's channel lists) render as
// one compact table with a column per key, instead of one full indexed
// key-value sub-table per element - the latter is unreadable for anything
// more than 2-3 items (a 40-channel list becomes ~200 rows of noise).
function renderCompactArrayTable(container, arr) {
  const keys = [...new Set(arr.flatMap(o => Object.keys(o)))];
  const table = document.createElement('table');
  table.className = 'result-table result-array-table';
  const headRow = document.createElement('tr');
  keys.forEach(k => {
    const th = document.createElement('th');
    th.textContent = k;
    headRow.appendChild(th);
  });
  table.appendChild(headRow);
  arr.forEach(obj => {
    const row = document.createElement('tr');
    keys.forEach(k => {
      const td = document.createElement('td');
      td.textContent = formatResultValue(obj[k]);
      row.appendChild(td);
    });
    table.appendChild(row);
  });
  container.appendChild(table);
}

function renderResultTable(container, obj) {
  container.innerHTML = '';
  if (obj === null || typeof obj !== 'object') {
    container.textContent = JSON.stringify(obj);
    return;
  }
  if (Array.isArray(obj) && obj.length && obj.every(isFlatObject)) {
    renderCompactArrayTable(container, obj);
    return;
  }
  const table = document.createElement('table');
  table.className = 'result-table';
  // Arrays of objects (e.g. band_channel_info's bands) get their own indexed
  // rows instead of collapsing to "N items" - otherwise nested structured
  // data like that is invisible in the result view.
  const entries = Array.isArray(obj) ? obj.map((v, i) => [i, v]) : Object.entries(obj);
  entries.forEach(([key, value]) => {
    const isExpandable = value !== null && typeof value === 'object' &&
      (!Array.isArray(value) || value.some(v => v !== null && typeof v === 'object'));

    if (isExpandable) {
      // A nested table (e.g. a band's channel list) needs the full row
      // width to be readable - cramming it into a value cell next to its
      // label produces a squeezed, unreadable mess. Give the label its own
      // full-width row, then the nested content its own full-width row.
      const labelRow = document.createElement('tr');
      const labelCell = document.createElement('td');
      labelCell.className = 'result-key result-nested-label';
      labelCell.colSpan = 2;
      labelCell.textContent = key;
      labelRow.appendChild(labelCell);
      table.appendChild(labelRow);

      const nestedRow = document.createElement('tr');
      const nestedCell = document.createElement('td');
      nestedCell.className = 'result-nested';
      nestedCell.colSpan = 2;
      renderResultTable(nestedCell, value);
      nestedRow.appendChild(nestedCell);
      table.appendChild(nestedRow);
    } else {
      const row = document.createElement('tr');
      const keyCell = document.createElement('td');
      keyCell.className = 'result-key';
      keyCell.textContent = key;
      const valCell = document.createElement('td');
      valCell.className = 'result-value';
      valCell.textContent = formatResultValue(value);
      row.append(keyCell, valCell);
      table.appendChild(row);
    }
  });
  container.appendChild(table);
}

// scan_wifi's result is a list of nearby APs - shown as one collapsed card
// per SSID (reusing the same card look as the interface list) instead of
// the generic key-value table, so the scan reads as a scan rather than a
// wall of JSON. Each card expands to BSSID/signal/mode/channel/rate/security.
function renderWifiScanResults(container, networks) {
  container.innerHTML = '';
  if (!networks.length) {
    container.innerHTML = '<div class="pi-log-empty">no networks found</div>';
    return;
  }

  // Same SSID filter box as the per-interface "Nearby networks" scan on
  // the Pi detail page - typing narrows this list without re-scanning.
  const searchWrap = document.createElement('div');
  searchWrap.className = 'pd-wifi-search-wrap';
  searchWrap.innerHTML = `${SEARCH_ICON_SVG}<input type="text" class="pd-wifi-search-input" placeholder="Filter by SSID…">`;
  container.appendChild(searchWrap);

  const listEl = document.createElement('div');
  listEl.className = 'pd-wifi-scan-list';
  container.appendChild(listEl);

  networks.forEach(net => {
    const card = document.createElement('div');
    card.className = 'pd-iface-card';
    card.innerHTML = `
      <div class="pd-iface-header">
        <span class="pd-iface-name">${net.ssid || '(hidden)'}</span>
        <span class="pd-iface-toggle">&#9654;</span>
      </div>
      <div class="pd-iface-body hidden"></div>
    `;
    const body = card.querySelector('.pd-iface-body');
    const rows = [
      ['BSSID', net.bssid],
      ['Mode', net.mode],
      ['Channel', net.channel],
      ['Frequency', net.frequency_mhz != null ? `${net.frequency_mhz} MHz` : null],
      ['Band', net.band],
      ['Rate', net.rate],
      ['Signal', net.signal_percent != null ? `${net.signal_percent}%` : null],
      ['Security', net.security],
    ].filter(([, v]) => v !== null && v !== undefined && v !== '');
    body.innerHTML = rows.length
      ? `<table class="result-table">${rows.map(([k, v]) =>
          `<tr><td class="result-key">${k}</td><td class="result-value">${v}</td></tr>`
        ).join('')}</table>`
      : '<div class="pi-log-empty">no data</div>';
    card.querySelector('.pd-iface-header').addEventListener('click', () => {
      const expanding = body.classList.contains('hidden');
      body.classList.toggle('hidden');
      card.querySelector('.pd-iface-toggle').innerHTML = expanding ? '&#9660;' : '&#9654;';
    });
    listEl.appendChild(card);
  });

  searchWrap.querySelector('.pd-wifi-search-input').addEventListener('input', (e) => {
    applyWifiSearchFilter(listEl, e.target.value);
  });
}

// Single dispatch point so every place a command's result gets rendered
// (live poll, and restored history on page reload) picks scan_wifi's
// per-AP cards over the generic key-value table without duplicating logic.
function renderCommandResult(container, action, result) {
  if (action === 'scan_wifi' && result && Array.isArray(result.networks)) {
    renderWifiScanResults(container, result.networks);
  } else {
    renderResultTable(container, result);
  }
}

// --- Fleet: merged scan_wifi result across several (Pi, interface) targets

// Same de-dup key an AP is identified by everywhere else: its BSSID, or
// its SSID if the BSSID wasn't reported (hidden/odd driver output).
function dedupeNetworks(networks) {
  const seen = new Map();
  networks.forEach(net => {
    const key = net.bssid || `ssid:${net.ssid}`;
    if (!seen.has(key)) seen.set(key, net);
  });
  return [...seen.values()];
}

// One merged AP row: same info table as the plain scan result, but its
// Connect button fans connect_wifi out to every (Pi, interface) target
// that took part in the scan, instead of just one. No per-target
// Disconnect here - which of several Pis/interfaces is "connected" to
// this particular AP isn't tracked on the fleet page (that's only shown
// on a single Pi's own detail page), so only Connect is offered.
function renderMergedWifiNetworkCard(targets, net) {
  const open = isOpenSecurity(net.security);
  const card = document.createElement('div');
  card.className = 'pd-iface-card';
  card.innerHTML = `
    <div class="pd-iface-header">
      <span class="pd-iface-name">${net.ssid || '(hidden)'}</span>
      <span class="pd-iface-toggle">&#9654;</span>
    </div>
    <div class="pd-iface-body hidden"></div>
  `;
  const body = card.querySelector('.pd-iface-body');
  const infoRows = [
    ['BSSID', net.bssid],
    ['Frequency', net.frequency_mhz != null ? `${net.frequency_mhz} MHz` : null],
    ['Band', net.band],
    ['Channel', net.channel],
    ['Rate', net.rate],
    ['Signal', net.signal_percent != null ? `${net.signal_percent}%` : null],
    ['Security', net.security],
  ].filter(([, v]) => v !== null && v !== undefined && v !== '');

  body.innerHTML = `
    <table class="result-table">${infoRows.map(([k, v]) =>
      `<tr><td class="result-key">${k}</td><td class="result-value">${v}</td></tr>`
    ).join('')}</table>
    <div class="wifi-connect-row">
      ${open ? '' : `
        <div class="password-wrap">
          <input type="password" class="wifi-connect-password field" placeholder="Password">
          <button type="button" class="password-toggle" title="Show password">&#128065;</button>
        </div>
      `}
      <button type="button" class="wifi-connect-btn">Connect (${targets.length} interface${targets.length === 1 ? '' : 's'})</button>
    </div>
    <div class="wifi-connect-status hint"></div>
  `;

  card.querySelector('.pd-iface-header').addEventListener('click', () => {
    const expanding = body.classList.contains('hidden');
    body.classList.toggle('hidden');
    card.querySelector('.pd-iface-toggle').innerHTML = expanding ? '&#9660;' : '&#9654;';
  });

  const stop = (e) => e.stopPropagation();
  const statusEl = body.querySelector('.wifi-connect-status');
  const passwordInput = body.querySelector('.wifi-connect-password');
  if (passwordInput) passwordInput.addEventListener('click', stop);

  body.querySelector('.wifi-connect-btn').addEventListener('click', async (e) => {
    stop(e);
    const btn = e.currentTarget;
    btn.disabled = true;
    statusEl.textContent = `Connecting on ${targets.length} interface(s)…`;
    const password = passwordInput && passwordInput.value ? passwordInput.value : undefined;
    const results = await Promise.allSettled(targets.map(async ({ piId, interface: iface }) => {
      const res = await postCmd(piId, 'connect_wifi', {
        ssid: net.ssid || undefined,
        bssid: net.bssid || undefined,
        password,
        interface: iface,
      });
      if (!res.ok) throw new Error(`${piId}/${iface}: ${res.status} ${await res.text()}`);
      const data = await res.json();
      const result = await awaitCommandResult(data.command_id, 30);
      if (!(result && result.connected)) {
        throw new Error(`${piId}/${iface}: failed${result && result.output ? ' - ' + result.output : ''}`);
      }
    }));
    const okCount = results.filter(r => r.status === 'fulfilled').length;
    const failed = results.filter(r => r.status === 'rejected');
    statusEl.textContent = failed.length
      ? `Connected on ${okCount}/${targets.length}. ${failed.map(r => r.reason.message).join('; ')}`
      : `Connected on all ${okCount} interface(s).`;
    btn.disabled = false;
  });

  return card;
}

function renderMergedWifiScan(container, targets, networks) {
  container.innerHTML = '';
  if (!networks.length) {
    container.innerHTML = '<div class="pi-log-empty">no networks found</div>';
    return;
  }
  const searchWrap = document.createElement('div');
  searchWrap.className = 'pd-wifi-search-wrap';
  searchWrap.innerHTML = `${SEARCH_ICON_SVG}<input type="text" class="pd-wifi-search-input" placeholder="Filter by SSID…">`;
  container.appendChild(searchWrap);

  const listEl = document.createElement('div');
  listEl.className = 'pd-wifi-scan-list';
  container.appendChild(listEl);

  networks.forEach(net => listEl.appendChild(renderMergedWifiNetworkCard(targets, net)));

  searchWrap.querySelector('.pd-wifi-search-input').addEventListener('input', (e) => {
    applyWifiSearchFilter(listEl, e.target.value);
  });
}

// One combined feed entry for a scan_wifi fan-out across several targets -
// replaces what would otherwise be one pending/complete entry per (Pi,
// interface), which for a scan is just the same nearby APs reported N times.
function addMergedScanEntry(targets, networksByTarget) {
  const entry = document.createElement('div');
  entry.className = 'cmd-entry';
  const label = `scan wifi &rarr; ${targets.length} interface${targets.length === 1 ? '' : 's'} (merged)`;
  entry.innerHTML = `
    <div class="hdr"><span><span class="toggle">&#9660;</span>${label}</span><span><span class="cmd-status complete">complete</span></span></div>
    <div class="result"></div>
  `;
  entry.querySelector('.hdr').addEventListener('click', () => {
    entry.classList.toggle('collapsed');
    entry.querySelector('.toggle').innerHTML = entry.classList.contains('collapsed') ? '&#9654;' : '&#9660;';
  });
  cmdResults.prepend(entry);

  const merged = dedupeNetworks(networksByTarget.flat());
  renderMergedWifiScan(entry.querySelector('.result'), targets, merged);
}

async function sendScanWifiFanOut(targets, params) {
  const results = await Promise.allSettled(targets.map(({ piId, interface: iface }) =>
    sendCommandAwaitResult(piId, 'scan_wifi', { ...params, interface: iface })
  ));
  const networksByTarget = [];
  const failed = [];
  results.forEach((r, i) => {
    if (r.status === 'fulfilled') networksByTarget.push((r.value && r.value.networks) || []);
    else failed.push(`${targets[i].piId}/${targets[i].interface}: ${r.reason.message}`);
  });
  if (failed.length) {
    alert(`${failed.length} of ${targets.length} scan(s) failed:\n${failed.join('\n')}`);
  }
  addMergedScanEntry(targets, networksByTarget);
}

function pushToPiLogPanel(piId, lines) {
  if (piId === 'all') return;
  let entry = piRows.get(piId);
  if (!entry) return;
  const empty = entry.logPanel.querySelector('.pi-log-empty');
  if (empty) empty.remove();
  lines.forEach(line => appendLineTo(entry.logPanel, line));
}

async function pollCommand(commandId, entry, piId, action) {
  const statusEl = entry.querySelector('.cmd-status');
  const resultEl = entry.querySelector('.result');
  for (let i = 0; i < 30; i++) {
    try {
      const res = await apiFetch(`${API}/commands/${commandId}`);
      if (res.ok) {
        const data = await res.json();
        statusEl.textContent = data.status;
        statusEl.className = `cmd-status ${data.status}`;
        if (data.result) renderCommandResult(resultEl, action, data.result);
        if (data.status === 'complete' && action === 'syslog' && Array.isArray(data.result?.logs)) {
          pushToPiLogPanel(piId, data.result.logs);
        }
        if (data.status !== 'pending') return;
      }
    } catch {
      // ignore transient errors and keep polling
    }
    await new Promise(r => setTimeout(r, 2000));
  }
}

async function sendOneCommand(url, action, params) {
  const res = await apiFetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, params }),
  });
  if (!res.ok) {
    const text = await res.text();
    throw new Error(`${res.status} ${text}`);
  }
  const data = await res.json();
  addCommandEntry(data.command_id, data.pi_id, data.action);
}

async function sendFanOut(tasks) {
  const results = await Promise.allSettled(tasks);
  const failed = results.filter(r => r.status === 'rejected');
  if (failed.length) {
    alert(`${failed.length} of ${tasks.length} command(s) failed to send:\n` +
      failed.map(r => r.reason.message).join('\n'));
  }
}

async function sendCommandAwaitResult(piId, action, params) {
  const res = await apiFetch(`${API}/pis/${encodeURIComponent(piId)}/cmd`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, params }),
  });
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  const data = await res.json();
  return awaitCommandResult(data.command_id, 30);
}

sendCmdBtn.addEventListener('click', async () => {
  const target = targetSelect.value;
  const action = actionSelect.value;
  const params = collectParams();
  const needsInterface = (ACTION_PARAMS[action] || []).some(f => f.type === 'interface');

  sendCmdBtn.disabled = true;
  try {
    if (target === 'all') {
      await sendOneCommand(`${API}/pis/broadcast`, action, params);
    } else if (target === 'multicast') {
      const targetIds = [...checkedPiIds];
      if (!targetIds.length) {
        alert('No Pis checked in the table for multicast.');
        return;
      }
      // One command per (checked Pi, that Pi's own primary interface) pair,
      // dispatched independently - no backend concept of "send to this
      // subset" to piggyback on, and each Pi can have several primary
      // interfaces now, so a single Pi can fan out into several commands.
      const targets = [];
      const rejections = [];
      for (const piId of targetIds) {
        const pi = pis.find(p => p.pi_id === piId);
        if (!needsInterface) {
          targets.push({ piId, interface: null });
          continue;
        }
        const ifaces = (pi && pi.primary_interfaces) || [];
        if (!ifaces.length) {
          rejections.push(`${piId}: no primary interface configured`);
          continue;
        }
        ifaces.forEach(iface => targets.push({ piId, interface: iface }));
      }
      if (rejections.length) alert(rejections.join('\n'));

      if (action === 'scan_wifi' && targets.length > 1) {
        // Scanning the same air from several interfaces just reports the
        // same nearby APs several times - merge into one de-duplicated
        // result instead of one feed entry per interface.
        await sendScanWifiFanOut(targets, params);
      } else {
        await sendFanOut(targets.map(({ piId, interface: iface }) =>
          sendOneCommand(`${API}/pis/${encodeURIComponent(piId)}/cmd`, action, iface ? { ...params, interface: iface } : params)
        ));
      }
    } else if (needsInterface && Array.isArray(params.interface)) {
      // Single Pi target, but multiple interfaces checked - one command per
      // checked interface, same fan-out principle as multicast.
      if (action === 'scan_wifi' && params.interface.length > 1) {
        await sendScanWifiFanOut(params.interface.map(iface => ({ piId: target, interface: iface })), params);
      } else {
        await sendFanOut(params.interface.map(iface =>
          sendOneCommand(`${API}/pis/${encodeURIComponent(target)}/cmd`, action, { ...params, interface: iface })
        ));
      }
    } else {
      await sendOneCommand(`${API}/pis/${encodeURIComponent(target)}/cmd`, action, params);
    }
  } catch (err) {
    alert(`Command failed: ${err.message}`);
  } finally {
    sendCmdBtn.disabled = false;
  }
});

// --- Shared log line rendering (used by per-Pi log panels) -----------------

function levelClass(level) {
  const l = (level || 'unknown').toLowerCase();
  return ['info', 'warning', 'error'].includes(l) ? `lvl-${l}` : 'lvl-unknown';
}

function buildLineElement(payload) {
  const div = document.createElement('div');
  div.className = 'line';

  if (typeof payload === 'string') {
    // Raw journalctl/tcpdump line - no structured fields, just show it as-is.
    const msg = document.createElement('span');
    msg.className = 'msg';
    msg.textContent = payload;
    div.append(msg);
  } else {
    const ts = document.createElement('span');
    ts.className = 'ts';
    ts.textContent = payload.timestamp || '';

    const lvl = document.createElement('span');
    const levelValue = payload.loglevel || payload.level || 'unknown';
    lvl.className = `lvl ${levelClass(levelValue)}`;
    lvl.textContent = levelValue;

    const msg = document.createElement('span');
    msg.className = 'msg';
    msg.textContent = payload.message !== undefined ? payload.message : JSON.stringify(payload);

    div.append(ts, lvl, msg);
  }
  return div;
}

// A busy tcpdump/syslog stream can push many messages per second; appending
// and re-measuring scroll position (a forced synchronous reflow) on every
// single one causes layout thrashing bad enough to stall the main thread and
// make unrelated UI (button clicks) feel like they hung. Instead, lines are
// queued and flushed together at most once per animation frame, so a burst
// of N messages costs one DOM batch + one layout read instead of N of each.
const linePanelQueues = new WeakMap();

function appendLineTo(container, payload) {
  let state = linePanelQueues.get(container);
  if (!state) {
    state = { queue: [], scheduled: false };
    linePanelQueues.set(container, state);
  }
  state.queue.push(payload);
  if (!state.scheduled) {
    state.scheduled = true;
    requestAnimationFrame(() => flushLineQueue(container, state));
  }
}

function flushLineQueue(container, state) {
  state.scheduled = false;
  const lines = state.queue;
  state.queue = [];
  if (!lines.length) return;

  const frag = document.createDocumentFragment();
  lines.forEach(payload => frag.appendChild(buildLineElement(payload)));
  container.appendChild(frag);

  // Cap growth so a long-running stream (tcpdump, syslog) doesn't leak memory.
  while (container.children.length > 500) container.removeChild(container.firstChild);

  const nearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 100;
  if (nearBottom) container.scrollTop = container.scrollHeight;
}

// --- Pi detail page ---------------------------------------------------
// Reached by clicking a Pi's id in the fleet table (#pi/<id> in the hash).
// One command bar scoped to just that one Pi, with the exact same action
// list as the fleet command builder (ACTION_PARAMS, in the same order),
// just always targeting this one piId instead of an arbitrary target.

function actionLabel(action) {
  return action.replace(/_/g, ' ');
}

function piInterfaces(piId) {
  const pi = pis.find(p => p.pi_id === piId);
  return (pi && pi.metadata && Array.isArray(pi.metadata.interfaces)) ? pi.metadata.interfaces : [];
}

function renderDetailParamFields(container, actionSelectEl, piId) {
  const fields = ACTION_PARAMS[actionSelectEl.value] || [];
  const interfaces = piInterfaces(piId);
  container.innerHTML = fields.map(f => {
    if (f.type === 'interface') {
      return `<label>${f.label}</label><div class="iface-dropdown-mount" data-param="${f.name}"></div>`;
    }
    if (f.type === 'password') {
      return `
        <label>${f.label}</label>
        <div class="password-wrap">
          <input class="field" data-param="${f.name}" type="password" ${f.default !== undefined ? `value="${f.default}"` : ''}>
          <button type="button" class="password-toggle" title="Show password">&#128065;</button>
        </div>
      `;
    }
    return `
      <label>${f.label}</label>
      <input class="field" data-param="${f.name}" type="${f.type}" ${f.default !== undefined ? `value="${f.default}"` : ''}>
    `;
  }).join('');

  container.querySelectorAll('.iface-dropdown-mount[data-param]').forEach(mount => {
    const box = buildIfaceDropdown();
    box.dataset.param = mount.dataset.param;
    setDropdownOptions(box, interfaces, []);
    mount.replaceWith(box);
  });
}

function collectDetailParams(container) {
  const params = {};
  container.querySelectorAll('[data-param]').forEach(el => {
    const name = el.dataset.param;
    if (el.classList.contains('iface-dropdown')) {
      const selected = getDropdownSelected(el);
      if (selected.length) params[name] = selected;
      return;
    }
    if (el.value === '') return;
    params[name] = el.type === 'number' ? Number(el.value) : el.value;
  });
  return params;
}

function detailAddCommandEntry(container, commandId, piId, action) {
  const entry = document.createElement('div');
  entry.className = 'cmd-entry';
  entry.dataset.commandId = commandId;
  entry.innerHTML = `
    <div class="hdr"><span><span class="toggle">&#9660;</span>${action}</span><span><span class="cmd-status pending">pending</span></span></div>
    <div class="result"></div>
  `;
  entry.querySelector('.hdr').addEventListener('click', () => {
    entry.classList.toggle('collapsed');
    entry.querySelector('.toggle').innerHTML = entry.classList.contains('collapsed') ? '&#9654;' : '&#9660;';
  });
  container.prepend(entry);
  pollCommand(commandId, entry, piId, action);
}

async function sendDetailCommand(actionSelectEl, paramsContainer, resultsContainer, piId) {
  const action = actionSelectEl.value;
  const params = collectDetailParams(paramsContainer);
  const needsInterface = (ACTION_PARAMS[action] || []).some(f => f.type === 'interface');
  try {
    if (needsInterface && Array.isArray(params.interface)) {
      if (!params.interface.length) {
        alert('Select at least one interface.');
        return;
      }
      const tasks = params.interface.map(async iface => {
        const res = await postCmd(piId, action, { ...params, interface: iface });
        if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
        const data = await res.json();
        detailAddCommandEntry(resultsContainer, data.command_id, data.pi_id, data.action);
      });
      const results = await Promise.allSettled(tasks);
      const failed = results.filter(r => r.status === 'rejected');
      if (failed.length) {
        alert(`${failed.length} command(s) failed to send:\n` + failed.map(r => r.reason.message).join('\n'));
      }
    } else {
      const res = await postCmd(piId, action, params);
      if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
      const data = await res.json();
      detailAddCommandEntry(resultsContainer, data.command_id, data.pi_id, data.action);
    }
  } catch (err) {
    alert(`Command failed: ${err.message}`);
  }
}

function setupDetailBar(actionSelectEl, paramsContainer, sendBtn, resultsContainer, actions, piId) {
  actionSelectEl.innerHTML = actions.map(a => `<option value="${a}">${actionLabel(a)}</option>`).join('');
  renderDetailParamFields(paramsContainer, actionSelectEl, piId);
  actionSelectEl.onchange = () => renderDetailParamFields(paramsContainer, actionSelectEl, piId);
  sendBtn.onclick = () => sendDetailCommand(actionSelectEl, paramsContainer, resultsContainer, piId);
  resultsContainer.innerHTML = '';
}

function isWifiInterface(name) {
  return /^(wl|wlan)/.test(name);
}

// Per-Pi caches for the expandable interface cards below - list_interfaces
// is fetched once per Pi visit and reused for every card; link_info is
// fetched once per wifi interface (by the icon refresh) and reused if the
// card is later expanded, instead of firing it again.
let detailIfaceDetailsCache = null;   // array from list_interfaces, or null until fetched
let detailLinkInfoCache = {};         // interface name -> link_info result

// Queries link_info for one wifi-capable interface and colors its icon:
// green (connected, with SSID in the tooltip) or dim gray (not connected).
// Fired once per wifi interface whenever the interface list is (re)built.
async function refreshWifiIcon(piId, iface) {
  const iconEl = document.querySelector(`#pdInterfaceList .wifi-icon[data-iface="${CSS.escape(iface)}"]`);
  if (!iconEl) return;
  try {
    const res = await postCmd(piId, 'link_info', { interface: iface });
    if (!res.ok) return;
    const data = await res.json();
    const result = await awaitCommandResult(data.command_id, 10);
    detailLinkInfoCache[iface] = result;
    const el = document.querySelector(`#pdInterfaceList .wifi-icon[data-iface="${CSS.escape(iface)}"]`);
    if (!el) return;
    const connected = !!(result && result.connected);
    el.classList.remove('wifi-unknown');
    el.classList.add(connected ? 'wifi-connected' : 'wifi-disconnected');
    el.title = connected ? `Wi-Fi connected${result.ssid ? ' — ' + result.ssid : ''}` : 'Wi-Fi not connected';
    const card = el.closest('.pd-iface-card');
    const mark = card && card.querySelector('.pd-iface-connected-mark');
    if (mark) {
      mark.classList.toggle('hidden', !connected);
      if (connected) mark.textContent = result.ssid ? `connected — ${result.ssid}` : 'connected';
    }
    const body = card && card.querySelector('.pd-iface-body');
    if (body && !body.classList.contains('hidden')) renderDetailIfaceBody(body, iface);
  } catch {
    // leave as "unknown" - backend/Pi unreachable or command timed out
  }
}

// Only ever touches the '.pd-iface-info' sub-div, not the whole card body -
// the wifi scan section (button + scanned-network cards) lives in a sibling
// div so a link_info refresh here doesn't wipe out an in-progress scan.
function renderDetailIfaceBody(body, name) {
  const info = body.querySelector('.pd-iface-info') || body;
  const details = (detailIfaceDetailsCache || []).find(d => d.name === name);
  const link = detailLinkInfoCache[name];
  const rows = [];
  if (details) {
    rows.push(['State', details.state]);
    rows.push(['Type', details.type]);
    rows.push(['MAC address', details.mac_address]);
    rows.push(['IP address', details.ip_address || '—']);
  }
  if (link) {
    rows.push(['Wi-Fi connected', link.connected ? 'yes' : 'no']);
    if (link.ssid) rows.push(['SSID', link.ssid]);
    if (link.bssid) rows.push(['BSSID', link.bssid]);
    if (link.frequency_mhz != null) rows.push(['Frequency', `${link.frequency_mhz} MHz`]);
    if (link.band) rows.push(['Band', link.band]);
    if (link.signal_dbm != null) rows.push(['Signal', `${link.signal_dbm} dBm`]);
    if (link.rx_bitrate_mbps != null) rows.push(['RX bitrate', `${link.rx_bitrate_mbps} Mbps`]);
    if (link.tx_bitrate_mbps != null) rows.push(['TX bitrate', `${link.tx_bitrate_mbps} Mbps`]);
  }
  info.innerHTML = rows.length
    ? `<table class="result-table">${rows.map(([k, v]) =>
        `<tr><td class="result-key">${k}</td><td class="result-value">${v ?? ''}</td></tr>`
      ).join('')}</table>`
    : '<div class="pi-log-empty">no data</div>';
}

function isOpenSecurity(security) {
  return !security || security === '--' || /^(none|open)$/i.test(security);
}

// One scanned AP, rendered as the same collapsed-card widget used
// elsewhere (interface list, plain scan_wifi results), but with a
// "connected" mark against the interface's current link_info and an
// inline Connect/Disconnect control using the same fields as the
// connect_wifi action (ssid/bssid/password/interface).
function renderWifiNetworkCard(piId, iface, net, connectedBssid) {
  const isConnected = !!(connectedBssid && net.bssid && connectedBssid === net.bssid);
  const open = isOpenSecurity(net.security);

  const card = document.createElement('div');
  card.className = 'pd-iface-card';
  card.innerHTML = `
    <div class="pd-iface-header">
      <span class="pd-iface-name">${net.ssid || '(hidden)'}</span>
      ${isConnected ? '<span class="badge badge-online">connected</span>' : ''}
      <span class="pd-iface-toggle">&#9654;</span>
    </div>
    <div class="pd-iface-body hidden"></div>
  `;
  const body = card.querySelector('.pd-iface-body');
  const infoRows = [
    ['SSID', net.ssid || '(hidden)'],
    ['BSSID', net.bssid],
    ['Frequency', net.frequency_mhz != null ? `${net.frequency_mhz} MHz` : null],
    ['Band', net.band],
    ['Channel', net.channel],
    ['Rate', net.rate],
    ['Signal', net.signal_percent != null ? `${net.signal_percent}%` : null],
    ['Security', net.security],
  ].filter(([, v]) => v !== null && v !== undefined && v !== '');

  body.innerHTML = `
    <table class="result-table">${infoRows.map(([k, v]) =>
      `<tr><td class="result-key">${k}</td><td class="result-value">${v}</td></tr>`
    ).join('')}</table>
    <div class="wifi-connect-row">
      ${isConnected
        ? `<button type="button" class="wifi-disconnect-btn">Disconnect</button>`
        : `${open ? '' : `
            <div class="password-wrap">
              <input type="password" class="wifi-connect-password field" placeholder="Password">
              <button type="button" class="password-toggle" title="Show password">&#128065;</button>
            </div>
          `}
          <button type="button" class="wifi-connect-btn">Connect</button>`
      }
    </div>
    <div class="wifi-connect-status hint"></div>
  `;

  card.querySelector('.pd-iface-header').addEventListener('click', () => {
    const expanding = body.classList.contains('hidden');
    body.classList.toggle('hidden');
    card.querySelector('.pd-iface-toggle').innerHTML = expanding ? '&#9660;' : '&#9654;';
  });

  const statusEl = body.querySelector('.wifi-connect-status');
  const stop = (e) => e.stopPropagation();

  const connectBtn = body.querySelector('.wifi-connect-btn');
  if (connectBtn) {
    connectBtn.addEventListener('click', async (e) => {
      stop(e);
      const passwordInput = body.querySelector('.wifi-connect-password');
      connectBtn.disabled = true;
      statusEl.textContent = 'Connecting…';
      try {
        const res = await postCmd(piId, 'connect_wifi', {
          ssid: net.ssid || undefined,
          bssid: net.bssid || undefined,
          password: passwordInput && passwordInput.value ? passwordInput.value : undefined,
          interface: iface,
        });
        if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
        const data = await res.json();
        const result = await awaitCommandResult(data.command_id, 30);
        statusEl.textContent = result && result.connected ? 'Connected.' : `Failed to connect${result && result.output ? ': ' + result.output : ''}`;
        delete detailLinkInfoCache[iface];
        refreshWifiIcon(piId, iface);
      } catch (err) {
        statusEl.textContent = `Failed: ${err.message}`;
      } finally {
        connectBtn.disabled = false;
      }
    });
  }
  const passwordInput = body.querySelector('.wifi-connect-password');
  if (passwordInput) passwordInput.addEventListener('click', stop);

  const disconnectBtn = body.querySelector('.wifi-disconnect-btn');
  if (disconnectBtn) {
    disconnectBtn.addEventListener('click', async (e) => {
      stop(e);
      disconnectBtn.disabled = true;
      statusEl.textContent = 'Disconnecting…';
      try {
        const res = await postCmd(piId, 'disconnect_wifi', { interface: iface });
        if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
        const data = await res.json();
        await awaitCommandResult(data.command_id, 15);
        statusEl.textContent = 'Disconnected.';
        delete detailLinkInfoCache[iface];
        refreshWifiIcon(piId, iface);
      } catch (err) {
        statusEl.textContent = `Failed: ${err.message}`;
      } finally {
        disconnectBtn.disabled = false;
      }
    });
  }

  return card;
}

// Icon-only toggle (refresh glyph, rotates like a chevron) that triggers a
// fresh scan and shows/hides the results panel - collapsing just hides the
// last scan, expanding always re-scans since which APs are in range/what
// their signal is goes stale almost immediately.
async function toggleWifiScan(piId, iface, btn, resultsEl, listEl) {
  const expanding = resultsEl.classList.contains('hidden');
  resultsEl.classList.toggle('hidden');
  btn.classList.toggle('open', expanding);
  if (expanding) await scanWifiNetworks(piId, iface, listEl, btn);
}

// Hides scanned-network cards whose SSID doesn't contain the typed text -
// pure client-side narrowing of the last scan, no re-scan involved.
function applyWifiSearchFilter(listEl, query) {
  const q = query.trim().toLowerCase();
  listEl.querySelectorAll('.pd-iface-card').forEach(card => {
    const ssid = (card.querySelector('.pd-iface-name')?.textContent || '').toLowerCase();
    card.classList.toggle('hidden', !!q && !ssid.includes(q));
  });
}

async function scanWifiNetworks(piId, iface, listEl, scanBtn) {
  scanBtn.disabled = true;
  listEl.innerHTML = '<div class="pi-log-empty">scanning…</div>';
  try {
    const res = await postCmd(piId, 'scan_wifi', { interface: iface });
    if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
    const data = await res.json();
    const result = await awaitCommandResult(data.command_id, 30);
    const networks = (result && result.networks) || [];
    listEl.innerHTML = '';
    if (!networks.length) {
      listEl.innerHTML = '<div class="pi-log-empty">no networks found</div>';
      return;
    }
    const connectedBssid = (detailLinkInfoCache[iface] && detailLinkInfoCache[iface].connected)
      ? detailLinkInfoCache[iface].bssid : null;
    networks.forEach(net => listEl.appendChild(renderWifiNetworkCard(piId, iface, net, connectedBssid)));
    const searchInput = listEl.closest('.pd-wifi-scan-results')?.querySelector('.pd-wifi-search-input');
    if (searchInput && searchInput.value) applyWifiSearchFilter(listEl, searchInput.value);
  } catch (err) {
    listEl.innerHTML = `<div class="pi-log-empty">scan failed: ${err.message}</div>`;
  } finally {
    scanBtn.disabled = false;
  }
}

// In-flight list_interfaces fetch, so the eager per-interface load below
// (fired once per interface as soon as the page opens) issues exactly one
// list_interfaces command instead of one per interface racing each other.
let detailIfaceDetailsPromise = null;

async function fetchDetailIfaceDetails(piId) {
  if (detailIfaceDetailsCache !== null) return detailIfaceDetailsCache;
  if (!detailIfaceDetailsPromise) {
    detailIfaceDetailsPromise = (async () => {
      try {
        const res = await postCmd(piId, 'list_interfaces', {});
        if (res.ok) {
          const data = await res.json();
          const result = await awaitCommandResult(data.command_id, 10);
          detailIfaceDetailsCache = (result && result.interfaces) || [];
        } else {
          detailIfaceDetailsCache = [];
        }
      } catch {
        detailIfaceDetailsCache = [];
      }
      return detailIfaceDetailsCache;
    })();
  }
  return detailIfaceDetailsPromise;
}

// Fetches whatever's missing for one card - list_interfaces (shared across
// all cards, fetched at most once per Pi visit) and, for wifi interfaces,
// link_info (usually already cached by refreshWifiIcon by the time a user
// expands the card).
async function loadDetailIfaceInfo(piId, name) {
  await fetchDetailIfaceDetails(piId);
  if (isWifiInterface(name) && !(name in detailLinkInfoCache)) {
    try {
      const res = await postCmd(piId, 'link_info', { interface: name });
      if (res.ok) {
        const data = await res.json();
        detailLinkInfoCache[name] = await awaitCommandResult(data.command_id, 10);
      }
    } catch {
      // leave unset - body will just omit the wifi rows
    }
  }
}

// Info is already fetched eagerly (see renderDetailInterfaceList), so
// expanding a card just reveals it - only re-fetch if that eager load
// hasn't landed yet (e.g. a slow/unresponsive Pi) or hasn't run at all.
async function toggleDetailIfaceCard(piId, card, name) {
  const body = card.querySelector('.pd-iface-body');
  const info = body.querySelector('.pd-iface-info');
  const toggle = card.querySelector('.pd-iface-toggle');
  const expanding = body.classList.contains('hidden');
  body.classList.toggle('hidden');
  toggle.innerHTML = expanding ? '&#9660;' : '&#9654;';
  if (!expanding) return;
  if (!info.innerHTML.trim()) {
    info.innerHTML = '<div class="pi-log-empty">loading…</div>';
    await loadDetailIfaceInfo(piId, name);
  }
  renderDetailIfaceBody(body, name);
}

function renderDetailInterfaceList(piId) {
  const interfaces = piInterfaces(piId);
  const list = document.getElementById('pdInterfaceList');
  list.innerHTML = interfaces.length ? interfaces.map(name => `
    <div class="pd-iface-card" data-iface="${name}">
      <div class="pd-iface-header">
        <span class="pd-iface-name">${name}</span>
        ${isWifiInterface(name) ? `
          <span class="wifi-icon wifi-unknown" data-iface="${name}" title="checking…">${WIFI_ICON_SVG}</span>
          <span class="pd-iface-connected-mark badge badge-online hidden" data-iface="${name}"></span>
        ` : ''}
        <span class="pd-iface-toggle">&#9654;</span>
      </div>
      <div class="pd-iface-body hidden">
        <div class="pd-iface-info"></div>
        ${isWifiInterface(name) ? `
          <div class="pd-wifi-scan-heading">
            <span>Nearby networks</span>
            <button type="button" class="pd-scan-wifi-toggle icon-btn" title="Scan for nearby networks">${SCAN_TRIGGER_ICON_SVG}</button>
          </div>
          <div class="pd-wifi-scan-results hidden">
            <div class="pd-wifi-search-wrap">
              ${SEARCH_ICON_SVG}
              <input type="text" class="pd-wifi-search-input" placeholder="Filter by SSID…">
            </div>
            <div class="pd-wifi-scan-list"></div>
          </div>
        ` : ''}
      </div>
    </div>
  `).join('') : '<div class="pi-log-empty">no interfaces</div>';

  list.querySelectorAll('.pd-iface-card').forEach(card => {
    const name = card.dataset.iface;
    card.querySelector('.pd-iface-header').addEventListener('click', () => toggleDetailIfaceCard(piId, card, name));
  });

  list.querySelectorAll('.pd-scan-wifi-toggle').forEach(btn => {
    const card = btn.closest('.pd-iface-card');
    const name = card.dataset.iface;
    const resultsEl = card.querySelector('.pd-wifi-scan-results');
    const listEl = card.querySelector('.pd-wifi-scan-list');
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleWifiScan(piId, name, btn, resultsEl, listEl);
    });
    const searchInput = card.querySelector('.pd-wifi-search-input');
    searchInput.addEventListener('click', (e) => e.stopPropagation());
    searchInput.addEventListener('input', () => applyWifiSearchFilter(listEl, searchInput.value));
  });

  interfaces.filter(isWifiInterface).forEach(name => refreshWifiIcon(piId, name));

  // Load every interface's list_interfaces/link_info info as soon as the
  // page is shown, not just when its card is expanded - so opening a card
  // shows data immediately instead of a "loading…" flash.
  interfaces.forEach(async (name) => {
    await loadDetailIfaceInfo(piId, name);
    const card = list.querySelector(`.pd-iface-card[data-iface="${CSS.escape(name)}"]`);
    const body = card && card.querySelector('.pd-iface-body');
    if (body) renderDetailIfaceBody(body, name);
  });
}

// Middle panel: syslog/tcpdump log windows, built once per visit to the
// detail page and reusing the same connectPiLog/toggleCapture/
// setStreamInterface functions the fleet table's inline rows use - those
// only ever touch the entry object by key, so a plain object standing in
// for a table row's state works without any changes to that logic. Unlike
// the fleet table, both windows are always "expanded" here (no toggle),
// so the socket opens immediately and closes when leaving the page.
function buildDetailLogEntry(piId) {
  const entry = { captureState: null, pcapState: null, ws: null };
  document.querySelectorAll('#pdLogPanel .pd-log-block').forEach(block => {
    const kind = block.dataset.kind;
    const spec = PANELS.find(p => p.kind === kind);
    entry[spec.panelKey] = block.querySelector('.pi-log-panel');
    entry[spec.panelKey].innerHTML = '<div class="pi-log-empty">waiting for messages…</div>';

    const ifaceSelect = block.querySelector('.pi-stream-iface');
    entry[kind + 'IfaceSelect'] = ifaceSelect;
    ifaceSelect.value = '';
    ifaceSelect.onchange = kind === 'tcpdump' ? null : (e) => setStreamInterface(piId, entry, spec, e.target.value);

    const captureBtn = block.querySelector('.pi-log-capture');
    captureBtn.innerHTML = '&#9210;';
    captureBtn.title = 'Start Capture';
    captureBtn.classList.remove('recording');
    captureBtn.onclick = () => toggleCapture(piId, spec, entry, captureBtn);

    block.querySelector('.pi-log-clear').onclick = () => clearPanel(piId, spec, entry[spec.panelKey]);
  });
  return entry;
}

function refreshDetailLogIfaceOptions(piId, entry) {
  const interfaces = piInterfaces(piId);
  PANELS.forEach(spec => {
    const select = entry[spec.kind + 'IfaceSelect'];
    if (!select) return;
    const current = select.value;
    select.innerHTML = '<option value="">select interface</option>' +
      interfaces.map(i => `<option value="${i}">${i}</option>`).join('');
    if (interfaces.includes(current)) select.value = current;
  });
}

function closeDetailLogEntry() {
  if (detailLogEntry && detailLogEntry.ws) detailLogEntry.ws.close();
  detailLogEntry = null;
}

// Called on every refreshPis() poll (5s) so status/last-seen/interfaces
// stay current without rebuilding the whole page (which would tear down
// the log WebSocket and reset in-progress captures every 5s).
function refreshDetailView() {
  if (!detailPiId || !document.getElementById('piDetail').classList.contains('active')) return;
  renderDetailInfo(detailPiId);

  const interfaces = piInterfaces(detailPiId);
  const key = JSON.stringify(interfaces);
  if (key === lastDetailInterfacesKey) return;
  lastDetailInterfacesKey = key;

  document.getElementById('pdActionParams').querySelectorAll('.iface-dropdown[data-param]').forEach(box => {
    const current = getDropdownSelected(box);
    setDropdownOptions(box, interfaces, current.filter(v => interfaces.includes(v)));
  });
  renderDetailInterfaceList(detailPiId);
  if (detailLogEntry) refreshDetailLogIfaceOptions(detailPiId, detailLogEntry);
}

function showPiDetail(piId) {
  closeDetailLogEntry();
  detailPiId = piId;
  lastDetailInterfacesKey = null;
  detailIfaceDetailsCache = null;
  detailIfaceDetailsPromise = null;
  detailLinkInfoCache = {};
  tabs.forEach(b => b.classList.remove('active'));
  views.forEach(v => v.classList.remove('active'));
  document.getElementById('piDetail').classList.add('active');
  document.getElementById('piDetailTitle').textContent = piId;

  renderDetailInfo(piId);
  renderDetailInterfaceList(piId);

  detailLogEntry = buildDetailLogEntry(piId);
  refreshDetailLogIfaceOptions(piId, detailLogEntry);
  detailLogEntry.ws = connectPiLog(piId, detailLogEntry);

  setupDetailBar(
    document.getElementById('pdAction'), document.getElementById('pdActionParams'),
    document.getElementById('pdActionSendBtn'), document.getElementById('pdActionResults'),
    Object.keys(ACTION_PARAMS), piId
  );
}

function showFleetView() {
  closeDetailLogEntry();
  detailPiId = null;
  document.getElementById('piDetail').classList.remove('active');
  tabs.forEach(b => b.classList.remove('active'));
  views.forEach(v => v.classList.remove('active'));
  tabs[0].classList.add('active');
  document.getElementById('fleet').classList.add('active');
}

document.getElementById('piDetailBack').addEventListener('click', () => {
  location.hash = '';
});

function routeDetail() {
  const m = location.hash.match(/^#pi\/(.+)$/);
  if (m) showPiDetail(decodeURIComponent(m[1]));
  else showFleetView();
}
window.addEventListener('hashchange', routeDetail);
routeDetail();
</script>
</body>
</html>
